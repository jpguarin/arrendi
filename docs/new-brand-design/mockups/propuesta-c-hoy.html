<style>
/* ---------- Primitive tokens: brand (docs/new-brand-design/brand-design.md) ---------- */
:root {
  --brand-navy: #14264C;
  --brand-green: #28B779;
  --brand-yellow: #FFC857;
  --brand-ivory: #F4F1E8;

  /* Primitive tokens: derived from the brand */
  --navy-950: #0A1122;
  --navy-900: #0C1528;
  --navy-800: #14203B;
  --navy-700: #1B2A4B;
  --navy-600: #2A3A60;
  --navy-400: #55607A;
  --navy-300: #A9B3CC;
  --ivory-50: #FBF9F3;
  --ivory-200: #EDE8DA;
  --ivory-300: #DDD6C3;
  --brick: #BC3D28;

  --font-display: "Red Hat Display", Inter, system-ui, sans-serif;
  --font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Semantic tokens: bill status. fill = marks, ink = text, bg = tinted surface */
  --st-paid: #1FA36C;      --st-paid-ink: #14734B;     --st-paid-bg: #DDF3E8;
  --st-partial: #D4951A;   --st-partial-ink: #7A5200;  --st-partial-bg: #FFEFC9;
  --st-pending: #4C6FC4;   --st-pending-ink: #2F4A94;  --st-pending-bg: #E1E8F8;
  --st-overdue: #D2513A;   --st-overdue-ink: #A3321E;  --st-overdue-bg: #FADFD8;
  --st-voided: #8A90A0;    --st-voided-ink: #565D70;   --st-voided-bg: #E7E8EC;
  --focus: #2F4A94;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --st-paid: #25A870;      --st-paid-ink: #6BDDAA;     --st-paid-bg: rgba(37, 168, 112, .18);
  --st-partial: #C08618;   --st-partial-ink: #FFC857;  --st-partial-bg: rgba(255, 200, 87, .15);
  --st-pending: #6485DA;   --st-pending-ink: #A9BEF5;  --st-pending-bg: rgba(100, 133, 218, .2);
  --st-overdue: #E05F47;   --st-overdue-ink: #FF9D88;  --st-overdue-bg: rgba(224, 95, 71, .2);
  --st-voided: #7C87A3;    --st-voided-ink: #A9B3CC;   --st-voided-bg: rgba(255, 255, 255, .08);
  --focus: #FFC857;
  color-scheme: dark;
}
.st-paid    { --st: var(--st-paid);    --st-ink: var(--st-paid-ink);    --st-bg: var(--st-paid-bg); }
.st-partial { --st: var(--st-partial); --st-ink: var(--st-partial-ink); --st-bg: var(--st-partial-bg); }
.st-pending { --st: var(--st-pending); --st-ink: var(--st-pending-ink); --st-bg: var(--st-pending-bg); }
.st-overdue { --st: var(--st-overdue); --st-ink: var(--st-overdue-ink); --st-bg: var(--st-overdue-bg); }
.st-voided  { --st: var(--st-voided);  --st-ink: var(--st-voided-ink);  --st-bg: var(--st-voided-bg); }

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.5; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a[href], label, select { cursor: pointer; }
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); letter-spacing: -.02em; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; background: var(--st-bg); color: var(--st-ink); }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); z-index: 90; max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 12px; background: var(--toast-bg, var(--brand-navy)); color: var(--toast-ink, var(--brand-ivory)); font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(10, 17, 34, .28); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}


/* ---------- Proposal C · Hoy: semantic tokens ---------- */
:root {
  --bg: var(--brand-ivory);
  --surface: #FFFDF8;
  --surface-2: var(--ivory-200);
  --line: var(--ivory-300);
  --ink: var(--brand-navy);
  --ink-2: var(--navy-400);
  --hero: var(--brand-navy);
  --on-hero: var(--brand-ivory);
  --hero-muted: #B9C2D8;
  --hero-tile: rgba(244, 241, 232, .1);
  --hero-line: rgba(244, 241, 232, .22);
  --cta: var(--brand-yellow);
  --on-cta: var(--brand-navy);
  --solid: var(--brand-navy);
  --on-solid: var(--brand-ivory);
  --danger: var(--st-overdue-ink);
  --shadow: 0 10px 30px -12px rgba(20, 38, 76, .28);
  --focus: #2F4A94;
}
:root[data-theme="dark"] {
  --bg: var(--navy-950);
  --surface: var(--navy-800);
  --surface-2: var(--navy-700);
  --line: var(--navy-600);
  --ink: var(--brand-ivory);
  --ink-2: var(--navy-300);
  --hero: var(--navy-700);
  --solid: var(--brand-ivory);
  --on-solid: var(--brand-navy);
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
  --toast-bg: var(--brand-ivory);
  --toast-ink: var(--brand-navy);
}
.on-hero { --focus: var(--brand-yellow); }

/* ---------- Shell: top bar on wide screens, floating dock on phones ---------- */
.topbar { display: none; }
.dock { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; height: 68px; padding: 0 6px; border-radius: 26px; background: var(--brand-navy); color: #B9C2D8; box-shadow: 0 14px 34px -10px rgba(10, 17, 34, .55); max-width: 460px; margin: 0 auto; }
:root[data-theme="dark"] .dock { background: var(--navy-700); border: 1px solid var(--navy-600); }
.dock .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border-radius: 18px; font-size: 11px; font-weight: 600; }
.dock .tab[aria-current] { color: var(--brand-ivory); }
.dock .tab[aria-current] svg { stroke-width: 2.5; }
.dock .go { justify-self: center; width: 64px; height: 64px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; background: var(--cta); color: var(--on-cta); border: 5px solid var(--bg); font-family: var(--font-display); font-weight: 800; font-size: 11px; line-height: 1; transition: transform .15s ease; }
.dock .go:active { transform: scale(.94); }
.dock .go span { display: grid; place-items: center; gap: 1px; }
main { padding-bottom: 116px; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
body.takeover .dock, body.takeover .topbar { display: none; }
body.takeover main { padding: 0; }

@media (min-width: 768px) {
  .dock { display: none; }
  .topbar { display: block; position: sticky; top: 0; z-index: 20; background: var(--hero); color: var(--on-hero); }
  .topbar .wrap { display: flex; align-items: center; gap: 20px; height: 68px; }
  .topbar nav { display: flex; gap: 4px; margin-right: auto; }
  .topbar .tab { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--hero-muted); }
  .topbar .tab:hover { color: var(--on-hero); }
  .topbar .tab[aria-current] { background: var(--hero-tile); color: var(--on-hero); }
  main { padding-bottom: 64px; }
  .wrap { padding: 0 28px; }
  .only-phone { display: none !important; }
}

/* ---------- Primitives ---------- */
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: -.03em; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.on-hero .icon-btn:hover, .topbar .icon-btn:hover { background: var(--hero-tile); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid var(--ink); font-size: 15px; font-weight: 600; white-space: nowrap; transition: transform .12s ease, opacity .15s ease; }
.btn:active { transform: scale(.97); }
.btn:hover { opacity: .88; }
.btn.cta { background: var(--cta); color: var(--on-cta); border-color: transparent; font-weight: 700; }
.btn.solid { background: var(--solid); color: var(--on-solid); border-color: transparent; }
.btn.soft { background: var(--surface-2); border-color: transparent; }
.btn.block { width: 100%; }
.btn.lg { min-height: 58px; font-size: 17px; }
.on-hero .btn:not(.cta) { border-color: var(--hero-line); color: var(--on-hero); }
h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: -.025em; }
h2 { font-weight: 800; font-size: 24px; line-height: 1.15; }
h3 { font-weight: 800; font-size: 18px; line-height: 1.2; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tile { background: var(--surface); border-radius: 26px; padding: 20px; box-shadow: var(--shadow); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.mock-note { margin-top: 44px; font-size: 13px; color: var(--ink-2); }
.mock-note a { text-decoration: underline; }
.hl { background: var(--cta); color: var(--on-cta); padding: 0 .16em; border-radius: .18em; box-decoration-break: clone; -webkit-box-decoration-break: clone; white-space: nowrap; }

/* ---------- Hero band ---------- */
.band { background: var(--hero); color: var(--on-hero); border-radius: 0 0 32px 32px; padding: 14px 0 30px; }
.band .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.band h1 { font-weight: 900; font-size: clamp(32px, 9vw, 48px); line-height: 1.04; }
.band .kicker { font-size: 14px; font-weight: 600; color: var(--hero-muted); margin-bottom: 10px; }
.band.slim h1 { font-size: clamp(30px, 7vw, 42px); }
@media (min-width: 768px) { .band { padding: 26px 0 40px; border-radius: 0 0 44px 44px; } }

/* ---------- Home ---------- */
.band.home { padding-bottom: 86px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
.hero-grid h1 { font-size: clamp(28px, 9.2vw, 62px); line-height: 1.16; }
@media (max-width: 359px) { .ring { width: 72px; height: 72px; } .ring b { font-size: 16px; } .hero-grid { gap: 10px; } }
.hero-grid h1 .nb { white-space: nowrap; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.hero-foot { margin-top: 16px; color: var(--hero-muted); font-size: 15px; }
.hero-foot b { color: var(--on-hero); font-weight: 600; }
.bento { display: grid; gap: 20px; margin-top: -58px; }
.col { display: grid; gap: 20px; align-content: start; min-width: 0; }
.queue { display: grid; gap: 12px; }
.task { display: grid; gap: 14px; }
.task-top { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
.task .n { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--st-bg); color: var(--st-ink); font-family: var(--font-display); font-weight: 900; font-size: 18px; grid-row: 1 / 3; }
.task h3 a { display: block; }
.task .amt { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.task .sub { grid-column: 2 / 4; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 14px; color: var(--ink-2); }
.task-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.col > *, .queue > *, .task > * { min-width: 0; }
.task-acts .btn { flex: 1; }
.units { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.unit-chip { display: grid; gap: 6px; padding: 12px; border-radius: 18px; background: var(--st-bg); color: var(--st-ink); min-height: 76px; align-content: space-between; }
.unit-chip b { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--ink); line-height: 1.15; }
.unit-chip span { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 1.2; }
.compo { display: flex; gap: 2px; height: 26px; margin: 14px 0; }
.compo span { min-width: 8px; background: var(--st); }
.compo span:first-child { border-radius: 4px 0 0 4px; }
.compo span:last-child { border-radius: 0 4px 4px 0; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.legend li { display: grid; grid-template-columns: 10px 1fr; gap: 0 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--st); }
.legend b { grid-column: 2; font-size: 15px; font-weight: 600; color: var(--ink); }
.done li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.done li:first-child { border-top: 0; padding-top: 0; }
.done li:last-child { padding-bottom: 0; }
.done .ok { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--st-paid); color: #fff; }
.done a { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.done small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 768px) and (max-width: 1023px) { .col.side { grid-template-columns: 1fr 1fr; } .col.side > :last-child { grid-column: 1 / 3; } }
@media (min-width: 1024px) { .bento { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; } .ring { width: 132px; height: 132px; } .ring b { font-size: 28px; } }

/* ---------- Bills ---------- */
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 18px -16px 0; padding: 2px 16px; }
.pill { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--hero-line); font-size: 15px; font-weight: 600; white-space: nowrap; color: var(--on-hero); flex: none; }
.pill[aria-pressed="true"] { background: var(--cta); color: var(--on-cta); border-color: transparent; }
select.pill { appearance: none; background: transparent; padding-right: 38px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 21px) 19px, calc(100% - 16px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
select.pill option { color: #14264C; }
.month { margin-top: 30px; }
.month h2 span { color: var(--ink-2); font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.bill { display: grid; gap: 14px; align-content: space-between; min-height: 164px; transition: transform .15s ease; position: relative; }
.bill:hover { transform: translateY(-3px); }
.bill .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.bill .top p { font-size: 14px; color: var(--ink-2); }
.bill .amt { font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 1; letter-spacing: -.03em; }
.bill .amt small { font-family: var(--font-sans); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 6px; }
.bill .bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); }
.bill .main::after { content: ""; position: absolute; inset: 0; border-radius: 26px; }
.bill .mini { position: relative; z-index: 1; min-height: 44px; padding: 0 16px; font-size: 14px; }
.empty { text-align: center; color: var(--ink-2); padding: 36px 16px; margin-top: 30px; }
@media (min-width: 768px) { .pills { margin-inline: 0; padding-inline: 2px; } }

/* ---------- Bill detail ---------- */
.band.bill-hero .figure { font-family: var(--font-display); font-weight: 900; font-size: clamp(46px, 13vw, 76px); line-height: 1; letter-spacing: -.04em; margin: 12px 0 8px; }
.band.bill-hero { padding-bottom: 70px; }
.round-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: -48px; padding: 14px 8px; }
.round-acts .ra { display: grid; justify-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-align: center; min-height: 72px; }
.round-acts .ra i { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); transition: transform .12s ease; }
.round-acts .ra:hover i { transform: scale(1.06); }
.round-acts .ra.cta i { background: var(--cta); color: var(--on-cta); }
.round-acts .ra.danger { color: var(--danger); }
.round-acts .ra[disabled] { opacity: .4; cursor: not-allowed; }
.two { display: grid; gap: 20px; margin-top: 20px; }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } .round-acts { max-width: 520px; } }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin: 14px 0 18px; }
.kv dt { font-size: 12px; color: var(--ink-2); }
.kv dd { font-weight: 500; font-size: 15px; }
.items { width: 100%; border-collapse: collapse; font-size: 15px; }
.items td, .items th { padding: 10px 0; border-top: 1px solid var(--line); text-align: left; font-weight: 400; }
.items td:last-child, .items th:last-child { text-align: right; white-space: nowrap; }
.items tfoot th { font-family: var(--font-display); font-weight: 800; font-size: 18px; border-top: 2px solid var(--ink); }
.tl { margin-top: 14px; }
.tl li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding-bottom: 16px; position: relative; }
.tl li:last-child { padding-bottom: 0; }
.tl li:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 2px; width: 2px; background: var(--line); }
.tl .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--st-bg, var(--surface-2)); color: var(--st-ink, var(--ink)); }
.tl p { font-weight: 600; font-size: 15px; }
.tl small { font-size: 13px; color: var(--ink-2); }

/* ---------- Properties ---------- */
.prop { margin-top: 26px; padding: 0; overflow: hidden; }
.prop-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 20px; }
.prop-head p { font-size: 14px; color: var(--ink-2); }
.prop-units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; padding: 0 12px 12px; }
.unit { position: relative; display: grid; gap: 12px; padding: 16px; border-radius: 18px; background: var(--bg); min-height: 148px; align-content: space-between; text-align: left; width: 100%; }
.unit::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--st); }
.unit .rent { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
.unit p { font-size: 14px; color: var(--ink-2); }
.unit .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.unit.add { background: transparent; border: 2px dashed var(--line); place-items: center; align-content: center; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.unit.add::before { display: none; }

/* ---------- Payment takeover ---------- */
.pay { min-height: 100dvh; background: var(--hero); color: var(--on-hero); padding: 10px 0 28px; }
:root[data-theme="dark"] .pay { background: var(--navy-900); }
.pay .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pay h1 { font-weight: 900; font-size: clamp(26px, 7.4vw, 40px); line-height: 1.08; }
.pay .picks { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 14px -16px 0; padding: 2px 16px; }
.pay .pick { flex: none; min-height: 44px; padding: 6px 16px; border-radius: 16px; border: 2px solid var(--hero-line); text-align: left; font-size: 13px; line-height: 1.25; color: var(--hero-muted); }
.pay .pick b { display: block; font-size: 14px; color: var(--on-hero); }
.pay .pick[aria-pressed="true"] { background: var(--on-hero); border-color: transparent; color: var(--navy-400); }

  if (act === 'quick') { PAY.amount = +el.dataset.v; PAY.fresh = true; paint(`[data-act="quick"][data-v="${el.dataset.v}"]`); }
  if (act === 'pick') { const b = billById(el.dataset.id); Object.assign(PAY, { id: b.id, amount: b.balance, fresh: true }); paint(`.pick[data-id="${b.id}"]`); }
  if (act === 'method') { PAY.method = el.dataset.v; paint(`[data-act="method"][data-v="${PAY.method}"]`); }
  if (act === 'day') { if (el.dataset.v === 'x') { toast('Aquí se abre el calendario'); return; } PAY.day = el.dataset.v; paint(`[data-act="day"][data-v="${PAY.day}"]`); }
  if (act === 'receipt') { PAY.receipt = !PAY.receipt; paint('[data-act="receipt"]'); }
  if (act === 'step') { if (!PAY.amount) { toast('Escribe el valor recibido'); return; } PAY.step = +el.dataset.s; paint(); window.scrollTo(0, 0); }
  if (act === 'save') {
    if (!PAY.amount) { toast('Escribe el valor recibido'); return; }
    registerPayment(PAY.id, PAY.amount, PAY.method, addDays(TODAY, -PAY.day));
    PAY.done = PAY.id; paint(); window.scrollTo(0, 0);
  }
}
document.addEventListener('change', (e) => { if (e.target.matches('[data-filter-unit]')) { FILTER.unit = e.target.value; paint('#f-unit'); } });
document.addEventListener('keydown', (e) => {
  if (ROUTE.name !== 'pay' || !PAY || PAY.done || !PAY.id) return;
  if (e.key === 'Escape') location.hash = BACK;
  else if (/^\d$/.test(e.key)) pressKey(e.key);
  else if (e.key === 'Backspace') pressKey('del');
});

document.querySelectorAll('[data-mark]').forEach((el) => { el.outerHTML = mark(34); });
document.querySelector('[data-back]').outerHTML = ic('back', 20);
start();
</script>
</body>
</html>
