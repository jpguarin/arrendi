<!doctype html>
<html lang="es-CO">
<head>

<title>Arrendi · Propuesta A · Ventanas</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Red+Hat+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ---------- Primitive tokens: brand (docs/new-brand-design/brand-design.md) ---------- */
:root {
  --brand-navy: #14264C;
  --brand-green: #28B779;
  --brand-yellow: #FFC857;
  --brand-ivory: #F4F1E8;

  /* Primitive tokens: derived from the brand */
  --navy-950: #0A1122;
  --navy-900: #0C1528;
  --navy-800: #14203B;
  --navy-700: #1B2A4B;
  --navy-600: #2A3A60;
  --navy-400: #55607A;
  --navy-300: #A9B3CC;
  --ivory-50: #FBF9F3;
  --ivory-200: #EDE8DA;
  --ivory-300: #DDD6C3;
  --brick: #BC3D28;

  --font-display: "Red Hat Display", Inter, system-ui, sans-serif;
  --font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Semantic tokens: bill status. fill = marks, ink = text, bg = tinted surface */
  --st-paid: #1FA36C;      --st-paid-ink: #14734B;     --st-paid-bg: #DDF3E8;
  --st-partial: #D4951A;   --st-partial-ink: #7A5200;  --st-partial-bg: #FFEFC9;
  --st-pending: #4C6FC4;   --st-pending-ink: #2F4A94;  --st-pending-bg: #E1E8F8;
  --st-overdue: #D2513A;   --st-overdue-ink: #A3321E;  --st-overdue-bg: #FADFD8;
  --st-voided: #8A90A0;    --st-voided-ink: #565D70;   --st-voided-bg: #E7E8EC;
  --focus: #2F4A94;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --st-paid: #25A870;      --st-paid-ink: #6BDDAA;     --st-paid-bg: rgba(37, 168, 112, .18);
  --st-partial: #C08618;   --st-partial-ink: #FFC857;  --st-partial-bg: rgba(255, 200, 87, .15);
  --st-pending: #6485DA;   --st-pending-ink: #A9BEF5;  --st-pending-bg: rgba(100, 133, 218, .2);
  --st-overdue: #E05F47;   --st-overdue-ink: #FF9D88;  --st-overdue-bg: rgba(224, 95, 71, .2);
  --st-voided: #7C87A3;    --st-voided-ink: #A9B3CC;   --st-voided-bg: rgba(255, 255, 255, .08);
  --focus: #FFC857;
  color-scheme: dark;
}
.st-paid    { --st: var(--st-paid);    --st-ink: var(--st-paid-ink);    --st-bg: var(--st-paid-bg); }
.st-partial { --st: var(--st-partial); --st-ink: var(--st-partial-ink); --st-bg: var(--st-partial-bg); }
.st-pending { --st: var(--st-pending); --st-ink: var(--st-pending-ink); --st-bg: var(--st-pending-bg); }
.st-overdue { --st: var(--st-overdue); --st-ink: var(--st-overdue-ink); --st-bg: var(--st-overdue-bg); }
.st-voided  { --st: var(--st-voided);  --st-ink: var(--st-voided-ink);  --st-bg: var(--st-voided-bg); }

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.5; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a[href], label, select { cursor: pointer; }
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); letter-spacing: -.02em; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; background: var(--st-bg); color: var(--st-ink); }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); z-index: 90; max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 12px; background: var(--toast-bg, var(--brand-navy)); color: var(--toast-ink, var(--brand-ivory)); font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(10, 17, 34, .28); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}


/* ---------- Proposal A · Ventanas: semantic tokens ---------- */
:root {
  --bg: var(--brand-ivory);
  --surface: var(--ivory-50);
  --surface-2: var(--ivory-200);
  --line: var(--ivory-300);
  --ink: var(--brand-navy);
  --ink-2: var(--navy-400);
  --primary: var(--brand-navy);
  --on-primary: var(--brand-ivory);
  --danger: var(--st-overdue-ink);
  /* Component tokens: the house and its windows */
  --house: var(--brand-navy);
  --win-ok: var(--brand-green);
  --win-partial: var(--brand-yellow);
  --win-late: var(--brick);
  --win-ink: var(--brand-navy);
  --win-late-ink: var(--brand-ivory);
  --meter-track: var(--ivory-300);
  --meter-fill: var(--brand-green);
  --scrim: rgba(20, 38, 76, .45);
}
:root[data-theme="dark"] {
  --bg: var(--navy-900);
  --surface: var(--navy-800);
  --surface-2: var(--navy-700);
  --line: var(--navy-600);
  --ink: var(--brand-ivory);
  --ink-2: var(--navy-300);
  --primary: var(--brand-ivory);
  --on-primary: var(--brand-navy);
  --house: var(--brand-ivory);
  --meter-track: var(--navy-600);
  --scrim: rgba(4, 8, 18, .7);
  --toast-bg: var(--brand-ivory);
  --toast-ink: var(--brand-navy);
}

/* ---------- Shell ---------- */
.app { min-height: 100dvh; display: flex; flex-direction: column; }
.mbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: -.03em; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.side { display: none; }
main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 12px 16px 104px; }
.tabs { position: fixed; inset: auto 0 0 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs .tab { flex: 1; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.tab .pill { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 10px; transition: background .2s ease; }
.tab[aria-current] { color: var(--ink); }
.tab[aria-current] .pill { background: var(--primary); color: var(--on-primary); }

@media (min-width: 768px) {
  .app { display: grid; grid-template-columns: 92px minmax(0, 1fr); }
  .mbar, .tabs { display: none; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 20px; position: sticky; top: 0; height: 100dvh; padding: 24px 10px; background: var(--surface-2); }
  .side .brand span { display: none; }
  .side nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .side .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); width: 100%; }
  .side .tab:hover { color: var(--ink); }
  .side .new span, .side .gallery span { display: none; }
  .side .new { width: 52px; padding: 0; }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  main { padding: 32px 28px 56px; }
}
@media (min-width: 1100px) {
  .app { grid-template-columns: 252px minmax(0, 1fr); }
  .side { align-items: stretch; padding: 28px 18px; }
  .side .brand { padding: 0 10px; }
  .side .brand span { display: inline; }
  .side .tab { flex-direction: row; gap: 10px; padding: 4px 10px 4px 4px; font-size: 15px; min-height: 48px; }
  .side .tab .pill { width: 40px; height: 40px; border-radius: 12px; }
  .side .tab[aria-current] { background: var(--surface); }
  .side .new { width: auto; padding: 0 16px; }
  .side .new span, .side .gallery span { display: inline; }
  .side .foot { flex-direction: row; justify-content: space-between; }
  main { padding: 40px 44px 64px; }
}

/* ---------- Primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 15px; font-weight: 600; white-space: nowrap; transition: background .15s ease, transform .1s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { opacity: .9; }
.btn.quiet { border-color: transparent; }
.btn.danger { color: var(--danger); border-color: transparent; }
.btn.block { width: 100%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--ink-2); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.2; letter-spacing: -.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head a { font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; display: inline-flex; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 32px; }
.meter { height: 12px; border-radius: 999px; background: var(--meter-track); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 999px; background: var(--meter-fill); }
.mock-note { margin-top: 40px; font-size: 13px; color: var(--ink-2); }
.mock-note a { text-decoration: underline; }
.win-dot { width: 14px; height: 14px; border-radius: 5px; background: var(--st); flex: none; }

/* ---------- Home ---------- */
.home { display: grid; gap: 32px; }
@media (min-width: 1100px) { .home { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; align-items: start; } }
.hero .figure { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 12vw, 68px); line-height: 1; letter-spacing: -.035em; margin: 6px 0 8px; }
.hero .meter { margin: 18px 0 14px; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.hero-stats dt { font-size: 13px; color: var(--ink-2); }
.hero-stats dd { font-weight: 600; }

.houses { display: grid; gap: 28px; }
.house { --roof-h: 44px; position: relative; padding-top: var(--roof-h); margin: 0 3px; }
.house .roof { position: absolute; top: 0; left: 0; width: 100%; height: var(--roof-h); overflow: visible; }
.house .roof polyline { fill: none; stroke: var(--house); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.house .chimney { position: absolute; top: calc(var(--roof-h) * .72 - 27px); right: 15%; width: 14px; height: 17px; border-radius: 4px; background: var(--house); }
.house-body { position: relative; padding: 0 16px 18px; }
.house-body::before, .house-body::after { content: ""; position: absolute; top: 0; bottom: 0; width: 6px; border-radius: 0 0 3px 3px; background: var(--house); }
.house-body::before { left: -3px; }
.house-body::after { right: -3px; }
.house-name { text-align: center; margin-top: -14px; }
.house-name h3 { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.2; }
.house-name p { font-size: 13px; color: var(--ink-2); }
.windows { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 132px)); justify-content: center; gap: 8px; margin-top: 14px; }
.win { width: 100%; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 96px; aspect-ratio: 1; padding: 10px 12px; border-radius: 16px; background: var(--win-ok); color: var(--win-ink); transition: transform .15s ease, box-shadow .15s ease; }
a.win:hover, button.win:hover { transform: translateY(-2px); box-shadow: 0 6px 0 -2px color-mix(in srgb, var(--house) 22%, transparent); }
.win.partial { background: var(--win-partial); }
.win.overdue { background: var(--win-late); color: var(--win-late-ink); }
.win.vacant, .win.add { background: transparent; border: 2px dashed var(--line); color: var(--ink-2); }
.win b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.2; }
.win .who { display: block; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win .state { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 1.2; }
.win.add { align-items: center; justify-content: center; text-align: center; font-size: 13px; font-weight: 600; width: 100%; }
.windows.detailed { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
.houses.street { grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px 36px; margin-top: 28px; }
.windows.detailed .win { aspect-ratio: auto; min-height: 148px; padding: 14px; }
.windows.detailed .rent { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.windows.detailed .who { white-space: normal; }

.owed { display: grid; gap: 10px; }
.owed-card { padding: 14px; display: grid; gap: 12px; }
.owed-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; border-radius: 10px; }
.owed-main .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.owed-main .amt { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.owed-main .meta { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.owed-actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.rows { overflow: hidden; container-type: inline-size; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 14px; min-height: 60px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
a.row:hover { background: var(--surface-2); }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { grid-column: 2; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .a { grid-row: 1 / 3; grid-column: 3; text-align: right; font-weight: 600; }
.row .a small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }
.row .lead { grid-row: 1 / 3; }
.ok-ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--st-paid-bg); color: var(--st-paid-ink); }

/* ---------- Bills ---------- */
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.select { min-height: 44px; padding: 0 36px 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-size: 14px; font-weight: 600; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 19px) 19px, calc(100% - 14px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
.month { margin-bottom: 28px; }
.month-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; margin-bottom: 10px; }
.month-head .meter { grid-column: 1 / 3; height: 6px; }
.empty { padding: 32px 16px; text-align: center; color: var(--ink-2); }
@media (min-width: 768px) { .chips { margin: 0; padding: 2px; } }
@container (min-width: 560px) {
  .row { grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) auto; padding: 12px 18px; }
  .row .s { grid-column: 3; grid-row: 1; }
  .row .a, .row .lead { grid-row: 1; }
  .row .a { grid-column: 4; min-width: 120px; }
}

/* ---------- Bill detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.detail { display: grid; gap: 20px; }
@media (min-width: 1000px) { .detail { grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 32px; align-items: start; } .detail .aside { order: 2; } }
.aside { display: grid; gap: 20px; }
.balance { padding: 20px; display: grid; gap: 14px; }
.balance .figure { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -.03em; }
.balance .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.paper { padding: 22px 20px; display: grid; gap: 20px; }
.paper-head { display: flex; align-items: center; gap: 12px; }
.paper-head .no { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.meta-grid dt { font-size: 12px; color: var(--ink-2); }
.meta-grid dd { font-weight: 500; font-size: 15px; }
.items { width: 100%; border-collapse: collapse; font-size: 15px; }
.items td, .items th { padding: 10px 0; border-top: 1px solid var(--line); text-align: left; font-weight: 400; }
.items td:last-child, .items th:last-child { text-align: right; white-space: nowrap; }
.items tfoot th { font-family: var(--font-display); font-weight: 800; font-size: 18px; border-top: 2px solid var(--ink); }
.timeline { padding: 18px 20px; }
.timeline li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 16px; position: relative; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--line); }
.timeline .dot { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--st-bg, var(--surface-2)); color: var(--st-ink, var(--ink)); }
.timeline p { font-weight: 500; font-size: 15px; }
.timeline small { font-size: 13px; color: var(--ink-2); }

/* ---------- Payment sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); animation: fade .2s ease; }
.sheet { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); background: var(--surface); border-radius: 26px 26px 0 0; animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field label, .field legend { font-size: 14px; font-weight: 600; padding: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-size: 16px; }
.input.amount { min-height: 64px; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
.hint { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.hint.st-paid, .hint.st-partial { color: var(--st-ink); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.seg label { position: relative; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

const SECTION = { home: 'home', bills: 'bills', bill: 'bills', properties: 'properties' };
const FILTER = { status: 'all', unit: 'all' };
const STATUS_FILTERS = [['all', 'Todas', () => true], ['open', 'Por cobrar', isOpen], ['overdue', 'Vencidas', (b) => b.status === 'overdue'], ['paid', 'Pagadas', (b) => b.status === 'paid']];
let UNDER = null;

function navHTML(current) {
  return NAV.map(([key, label, icon]) => key === 'settings'
    ? `<button class="tab" data-act="toast" data-msg="Ajustes no hace parte de este mock"><span class="pill">${ic(icon, 22)}</span>${label}</button>`
    : `<a class="tab" href="#${key}" ${current === key ? 'aria-current="page"' : ''}><span class="pill">${ic(icon, 22)}</span>${label}</a>`).join('');
}

/** A property drawn as the house of the logo: every unit is a window lit by its status. */
function house(p, detailed) {
  const units = UNITS.filter((u) => u.p === p.id);
  const windows = units.map((u) => {
    const key = unitStatus(u);
    const s = UNIT_STATUS[key];
    const bill = currentBill(u);
    const cls = key === 'up_to_date' ? '' : key;
    if (!u.tenant) {
      return `<li><button class="win vacant" data-act="toast" data-msg="Crear contrato no hace parte de este mock"><span><b>${u.name}</b><span class="who">${detailed ? u.use + ' · sin contrato' : 'Sin contrato'}</span></span><span class="state">${ic(s.icon, 14, 2.5)}${s.label}</span></button></li>`;
    }
    const state = bill && bill.status === 'overdue' ? `${daysBetween(bill.due, TODAY)} días en mora` : bill && bill.status === 'partial' ? `Debe ${pesos(bill.balance)}` : s.label;
    const body = detailed
      ? `<span><b>${u.name}</b><span class="who">${u.tenant}</span></span><span><span class="rent num">${pesos(u.rent)}</span><span class="who">${u.use} · paga el día ${u.day}</span></span>`
      : `<span><b>${u.name}</b><span class="who">${u.short}</span></span>`;
    return `<li><a class="win ${cls}" href="#bill/${bill.id}" aria-label="${u.name}, ${u.tenant}, ${state}">${body}<span class="state">${ic(s.icon, 14, 2.5)}${state}</span></a></li>`;
  }).join('');
  const add = detailed ? `<li><button class="win add" data-act="toast" data-msg="Agregar unidad no hace parte de este mock">${ic('plus', 22)}Agregar unidad</button></li>` : '';
  return `<article class="house" aria-label="${p.name}">
    <svg class="roof" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,44 50,3 100,44"/></svg><span class="chimney"></span>
    <div class="house-body">
      <div class="house-name"><h3>${p.name}</h3><p>${p.address} · ${p.city}</p></div>
      <ul class="windows ${detailed ? 'detailed' : ''}">${windows}${add}</ul>
    </div>
  </article>`;
}

const owedCard = (b) => {
  const u = billUnit(b);
  return `<li class="card owed-card st-${b.status}">
    <a class="owed-main" href="#bill/${b.id}">
      <span class="win-dot"></span><span class="who">${u.name} · ${u.tenant}</span><span class="amt num">${pesos(b.balance)}</span>
      <span class="meta">${badge(b.status)}<span>${owedDetail(b)}</span></span>
    </a>
    <div class="owed-actions">
      ${b.status === 'overdue' ? `<button class="btn" data-act="remind" data-id="${b.id}">${ic('bell', 18)}Recordar</button>` : ''}
      <a class="btn primary" href="#pay/${b.id}">Registrar pago</a>
    </div>
  </li>`;
};
const billRow = (b) => {
  const u = billUnit(b);
  const owes = isOpen(b) && b.balance < b.total;
  return `<a class="row st-${b.status}" href="#bill/${b.id}">
    <span class="win-dot lead"></span>
    <span class="t">${u.name} · ${u.tenant}</span>
    <span class="s">${badge(b.status)}<span class="num">${billNo(b.number)} · vence ${dayMonth(b.due)}</span></span>
    <span class="a num">${pesos(isOpen(b) ? b.balance : b.total)}${owes ? '<small>saldo</small>' : ''}</span>
  </a>`;
};

const SCREENS = {
  home() {
    const s = summary();
    return `<div class="home">
      <div class="stack">
        <section class="hero" aria-label="Resumen del mes">
          <p class="muted small">Hola, ${OWNER.first} · domingo 11 de octubre</p>
          <h1 class="sr-only">Inicio</h1>
          <p class="eyebrow" style="margin-top:18px">Recaudado en ${monthName(s.period)}</p>
          <p class="figure num">${pesos(s.collected)}</p>
          <p class="muted">de <span class="num">${pesos(s.expected)}</span> esperados</p>
          <div class="meter" role="img" aria-label="${s.percent} % recaudado"><span style="width:${s.percent}%"></span></div>
          <dl class="hero-stats">
            <div><dt>Recaudo</dt><dd class="num">${s.percent} %</dd></div>
            <div><dt>Pendiente</dt><dd class="num">${pesos(s.pending)}</dd></div>
            <div><dt>En mora</dt><dd>${s.unitsOverdue} de ${s.unitsTotal} unidades</dd></div>
          </dl>
        </section>
        <section aria-labelledby="h-houses">
          <div class="sec-head"><h2 id="h-houses">Tus inmuebles</h2><a href="#properties">Ver todo</a></div>
          <div class="houses">${PROPERTIES.map((p) => house(p, false)).join('')}</div>
        </section>
      </div>
      <div class="stack">
        <section aria-labelledby="h-owed">
          <div class="sec-head"><h2 id="h-owed">Por cobrar</h2><span class="muted small num">${s.receivable.length} ${s.receivable.length === 1 ? 'cuenta' : 'cuentas'}</span></div>
          ${s.receivable.length ? `<ul class="owed">${s.receivable.map(owedCard).join('')}</ul>` : `<p class="card empty">Todo cobrado. No hay cuentas pendientes este mes.</p>`}
        </section>
        <section aria-labelledby="h-paid">
          <div class="sec-head"><h2 id="h-paid">Pagadas este mes</h2><a href="#bills">Todas las cuentas</a></div>
          <div class="card rows">${s.paid.map((b) => { const u = billUnit(b), p = lastPayment(b); return `<a class="row" href="#bill/${b.id}"><span class="ok-ic lead">${ic('check', 16, 2.5)}</span><span class="t">${u.name} · ${u.tenant}</span><span class="s">${dayMonth(p.date)} · ${METHODS[p.method].toLowerCase()}</span><span class="a num">${pesos(b.total)}</span></a>`; }).join('')}</div>
        </section>
      </div>
    </div>`;
  },

  bills() {
    const match = STATUS_FILTERS.find((f) => f[0] === FILTER.status)[2];
    const months = PERIODS().map((period) => {
      const list = BILLS.filter((b) => b.period === period && match(b) && (FILTER.unit === 'all' || b.unit === FILTER.unit)).sort(byUrgency);
      if (!list.length) return '';
      const s = summary(period);
      return `<section class="month" aria-label="${monthTitle(period)}">
        <div class="month-head"><h2>${monthTitle(period)}</h2><span class="small muted num">${pesos(s.collected)} de ${pesos(s.expected)}</span>
          <div class="meter" role="img" aria-label="${s.percent} % recaudado"><span style="width:${s.percent}%"></span></div></div>
        <div class="card rows">${list.map(billRow).join('')}</div>
      </section>`;
    }).join('');
    return `<div class="head"><h1>Cuentas</h1><button class="btn primary" data-act="toast" data-msg="Crear una cuenta manual no hace parte de este mock">${ic('plus', 18)}Nueva cuenta</button></div>
      <div class="filters">
        <div class="chips" role="group" aria-label="Filtrar por estado">${STATUS_FILTERS.map(([k, l]) => `<button class="chip" data-act="filter" data-status="${k}" aria-pressed="${FILTER.status === k}">${l}</button>`).join('')}</div>
        <label class="sr-only" for="f-unit">Filtrar por unidad</label>
        <select class="select" id="f-unit" data-filter-unit><option value="all">Todas las unidades</option>${UNITS.filter((u) => u.tenant).map((u) => `<option value="${u.id}" ${FILTER.unit === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}</select>
      </div>
      ${months || `<p class="card empty">No hay cuentas con ese filtro.</p>`}`;
  },

  bill(id) {
    const b = billById(id) || billById(43);
    const u = billUnit(b), p = propById(u.p);
    const open = isOpen(b);
    const line = b.status === 'paid' ? `Pagada el ${dayMonth(lastPayment(b).date)}` : b.status === 'overdue' ? `Venció el ${dayMonth(b.due)} · ${owedDetail(b)}` : `Vence el ${dayMonth(b.due)}`;
    return `<a class="back" href="#bills">${ic('back', 18)}Cuentas</a>
      <div class="head"><div><h1>Cuenta ${billNo(b.number)}</h1><p class="muted">${u.name} · ${u.tenant}</p></div>${badge(b.status)}</div>
      <div class="detail">
        <div class="aside">
          <section class="card balance st-${b.status}" aria-label="Saldo">
            <div><p class="eyebrow">${open ? 'Saldo por cobrar' : 'Total pagado'}</p><p class="figure num">${pesos(open ? b.balance : b.total)}</p></div>
            <p class="small muted">${line}${open && b.balance < b.total ? ` · abonó ${pesos(b.total - b.balance)}` : ''}</p>
            ${open ? `<a class="btn primary block" href="#pay/${b.id}">Registrar pago</a>` : ''}
            <div class="two">
              <button class="btn" data-act="toast" data-msg="Cuenta reenviada a ${u.short}">${ic('send', 18)}Reenviar</button>
              <button class="btn" data-act="toast" data-msg="Descargando ${billNo(b.number)}.pdf">${ic('download', 18)}PDF</button>
            </div>
            ${open ? (b.payments.length ? `<p class="hint">${ic('ban', 14)}No se puede anular: ya tiene pagos.</p>` : `<button class="btn danger" data-act="toast" data-msg="Anular pide confirmación; no hace parte de este mock">Anular cuenta</button>`) : ''}
          </section>
          <section aria-labelledby="h-tl">
            <div class="sec-head"><h2 id="h-tl">Historial</h2></div>
            <ol class="card timeline">${timeline(b).map((e) => `<li class="${e.tone ? 'st-' + e.tone : ''}"><span class="dot">${ic(e.icon, 15, 2.5)}</span><div><p>${e.text}</p><small>${fullDate(e.date)}${e.sub ? ' · ' + e.sub : ''}</small></div></li>`).join('')}</ol>
          </section>
        </div>
        <article class="card paper" aria-label="Documento">
          <div class="paper-head">${mark(44)}<div><p class="eyebrow">Cuenta de cobro</p><p class="no num">${billNo(b.number)}</p></div></div>
          <dl class="meta-grid">
            <div><dt>Arrendador</dt><dd>${OWNER.name}</dd><dd class="small muted">${OWNER.doc}</dd></div>
            <div><dt>Arrendatario</dt><dd>${u.tenant}</dd><dd class="small muted">${u.doc}</dd></div>
            <div><dt>Inmueble</dt><dd>${p.name} · ${u.name}</dd></div>
            <div><dt>Periodo</dt><dd>${monthTitle(b.period)}</dd></div>
            <div><dt>Emisión</dt><dd class="num">${fullDate(b.issue)}</dd></div>
            <div><dt>Vencimiento</dt><dd class="num">${fullDate(b.due)}</dd></div>
          </dl>
          <table class="items">
            <tbody>${b.items.map((i) => `<tr><td>${i.desc}</td><td class="num">${pesos(i.amount)}</td></tr>`).join('')}</tbody>
            <tfoot><tr><th scope="row">Total</th><th class="num">${pesos(b.total)}</th></tr></tfoot>
          </table>
          <p class="small muted">Pagar a ${OWNER.bank} · ${OWNER.nequi}</p>
        </article>
      </div>`;
  },

  properties() {
    return `<div class="head"><div><h1>Inmuebles</h1><p class="muted">${PROPERTIES.length} inmuebles · ${UNITS.length} unidades · ${UNITS.filter((u) => !u.tenant).length} disponible</p></div>
      <button class="btn primary" data-act="toast" data-msg="Agregar inmueble no hace parte de este mock">${ic('plus', 18)}Agregar inmueble</button></div>
      <div class="houses street">${PROPERTIES.map((p) => house(p, true)).join('')}</div>`;
  },
};

function paySheet(id) {
  const b = billById(id), u = billUnit(b);
  return `<div class="scrim" data-act="close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pay-title">
      <div class="sheet-head"><div><h2 id="pay-title">Registrar pago</h2><p class="small muted">${u.name} · ${u.tenant} · ${billNo(b.number)}</p></div>
        <button class="icon-btn" data-act="close" aria-label="Cerrar">${ic('x', 22)}</button></div>
      <form class="form" id="pay-form" data-id="${b.id}">
        <div class="field"><label for="pay-amount">Valor recibido</label>
          <input class="input amount num" id="pay-amount" inputmode="numeric" autocomplete="off" value="${pesos(b.balance)}">
          <p class="hint" id="pay-hint" aria-live="polite"></p></div>
        <div class="field"><label for="pay-date">Fecha del pago</label><input class="input" id="pay-date" type="date" value="${TODAY}" max="${TODAY}"></div>
        <fieldset class="field"><legend>Medio de pago</legend>
          <div class="seg">${Object.entries(METHODS).map(([k, l], i) => `<label><input type="radio" name="method" value="${k}" ${i === 0 ? 'checked' : ''}>${l}</label>`).join('')}</div></fieldset>
        <div class="field"><span class="small" style="font-weight:600">Comprobante <span class="muted" style="font-weight:400">(opcional)</span></span>
          <button type="button" class="drop" data-act="toast" data-msg="Aquí se adjunta un PDF, JPG o PNG">${ic('clip', 18)}Adjuntar foto o PDF</button></div>
        <label class="switch-row">Enviar recibo a ${u.short}<span class="switch"><input type="checkbox" checked><span></span></span></label>
        <div class="sheet-foot"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Guardar pago</button></div>
      </form>
    </div>`;
}
function payHint() {
  const form = document.getElementById('pay-form');
  if (!form) return;
  const b = billById(form.dataset.id);
  const input = document.getElementById('pay-amount');
  const value = Math.min(parsePesos(input.value), b.balance);
  input.value = value ? pesos(value) : '';
  const hint = document.getElementById('pay-hint');
  const left = b.balance - value;
  hint.className = 'hint ' + (value && !left ? 'st-paid' : value ? 'st-partial' : '');
  hint.innerHTML = !value ? `Saldo de la cuenta: ${pesos(b.balance)}` : left ? `${ic('half', 14)}Abono. Queda un saldo de ${pesos(left)}` : `${ic('check', 14, 2.5)}La cuenta queda pagada`;
}

function render() {
  let route = ROUTE;
  const paying = route.name === 'pay' && billById(route.arg) && isOpen(billById(route.arg));
  if (route.name === 'pay') {
    if (!UNDER || (PREV && PREV.name !== 'pay')) UNDER = PREV && PREV.name !== 'pay' ? PREV : parseHash('bill/' + route.arg);
    route = UNDER;
  }
  const screen = SCREENS[route.name] ? route.name : 'home';
  document.getElementById('view').innerHTML = SCREENS[screen](route.arg) + `<p class="mock-note">Mock · Propuesta A «Ventanas» · <a href="index.html">ver las tres propuestas</a></p>`;
  document.querySelectorAll('[data-nav]').forEach((n) => { n.innerHTML = navHTML(SECTION[screen]); });
  document.getElementById('overlay').innerHTML = paying ? paySheet(ROUTE.arg) : '';
  if (paying) { payHint(); document.getElementById('pay-amount').focus(); }
  else if (PREV && PREV.name !== 'pay') window.scrollTo(0, 0);
}
function closeSheet() { location.hash = UNDER ? UNDER.hash : 'home'; }
function onAct(act, el) {
  if (act === 'close') closeSheet();
  if (act === 'filter') { FILTER.status = el.dataset.status; render(); }
}
document.addEventListener('change', (e) => { if (e.target.matches('[data-filter-unit]')) { FILTER.unit = e.target.value; render(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'pay-amount') payHint(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ROUTE.name === 'pay') closeSheet(); });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  const amount = parsePesos(document.getElementById('pay-amount').value);
  if (!amount) { toast('Escribe el valor recibido'); return; }
  const b = registerPayment(form.dataset.id, amount, form.method.value, document.getElementById('pay-date').value);
  toast(b.status === 'paid' ? `Pago guardado. ${billUnit(b).name} quedó al día` : `Abono guardado. Saldo: ${pesos(b.balance)}`);
  closeSheet();
});

document.querySelectorAll('[data-mark]').forEach((el) => { el.outerHTML = mark(34); });
document.querySelector('[data-plus]').outerHTML = ic('plus', 20);
document.querySelector('[data-back]').outerHTML = ic('back', 18);
start();
</script>
</body>
</html>
