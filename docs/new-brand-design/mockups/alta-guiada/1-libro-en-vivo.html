<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alta guiada · 1 · Libro en vivo</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Red+Hat+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* ---------- Layout ----------
   Phone (< 768): one column, the preview is hidden.
   Tablet (768+): form and preview half and half; the preview table drops a column.
   Desktop (1024+): a fixed form column and a wide preview. */
.shell { min-height: 100dvh; display: grid; }
.flow { display: flex; flex-direction: column; min-height: 100dvh; width: 100%; max-width: 480px; margin: 0 auto; background: var(--background); }
.preview { display: none; container-type: inline-size; }
@media (min-width: 768px) {
  .shell { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .flow { max-width: none; border-right: 1px solid var(--border); background: var(--card); }
  .preview { display: flex; }
  .body, .hero { padding-left: 28px; padding-right: 28px; }
  .steps { padding-left: 28px; padding-right: 28px; }
  .top { padding-left: 28px; }
  .action-footer { padding-left: 28px; padding-right: 28px; }
}
@media (min-width: 1024px) {
  .shell { grid-template-columns: minmax(480px, 560px) minmax(0, 1fr); }
  .body, .hero { padding-left: 40px; padding-right: 40px; }
  .steps { padding-left: 40px; padding-right: 40px; }
  .top { padding-left: 40px; }
  .action-footer { padding-left: 40px; padding-right: 40px; }
}

/* ---------- Header: brand and the named stepper ---------- */
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0 20px; min-height: 58px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px 20px 0; }
.step { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
.step .bar { height: 6px; border-radius: 999px; background: var(--input); opacity: .55; }
.step.done .bar, .step.now .bar { background: var(--primary); opacity: 1; }
.step.now { color: var(--foreground); }
.step .lbl { display: flex; align-items: center; gap: 4px; }
.step.done .lbl svg { color: var(--positive-ink); }

.body { flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 28px 20px 32px; }
.intro { display: flex; flex-direction: column; gap: 8px; }
.intro h1 { font-weight: 700; }
.intro p { font-size: 15px; color: var(--muted-foreground); }
.group { display: flex; flex-direction: column; gap: 14px; }
.group-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.group-title svg { width: 16px; height: 16px; }
.footer-row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

/* ---------- Units step: compact rows ---------- */
.unit-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; gap: 8px; align-items: start; }
.unit-row .segmented { height: 48px; align-items: stretch; }
.unit-row .segmented button { min-height: 0; }
.unit-row .num { width: 22px; font-size: 13px; color: var(--muted-foreground); padding-top: 13px; }
.unit-list { display: flex; flex-direction: column; gap: 10px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--input); background: var(--card); font-size: 14px; font-weight: 600; color: var(--foreground-soft); }
.chip:hover { background: var(--muted); }
.chip svg { width: 16px; height: 16px; }
@media (max-width: 400px) { .unit-row { grid-template-columns: minmax(0, 1fr) 44px; } .unit-row .segmented { grid-column: 1 / 2; grid-row: 2; } }

/* ---------- Unit picker on the lease step ---------- */
.unit-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-pick .toggle { flex: 1 1 auto; min-width: 96px; }

/* ---------- Welcome and done ---------- */
.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 32px 20px; }
.hero h1 { font-size: 30px; line-height: 1.15; font-weight: 800; }
.hero .lead { font-size: 16px; color: var(--muted-foreground); max-width: 40ch; }
.plan { display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--border); }
.plan li:last-child { border-bottom: 1px solid var(--border); }
.plan .n { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--muted); font-family: var(--font-heading); font-weight: 800; font-size: 17px; }
.plan b { display: block; font-size: 15px; }
.plan span { font-size: 14px; color: var(--muted-foreground); }
.ok { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--positive-tint); color: var(--positive-ink); }
.ok svg { width: 32px; height: 32px; }
.recap { padding: 4px 16px; }
.recap div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; font-size: 15px; border-top: 1px solid var(--border); }
.recap div:first-child { border-top: 0; }
.recap dt { color: var(--muted-foreground); }
.recap dd { font-weight: 600; text-align: right; }

/* ---------- Live preview: the property as Inmuebles will show it ---------- */
.preview { position: sticky; top: 0; height: 100dvh; flex-direction: column; justify-content: center; gap: 16px; padding: 40px clamp(24px, 5vw, 80px); background: var(--background); }
.pv-welcome { display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
.pv-welcome h2 { font-family: var(--font-heading); font-size: clamp(22px, 3cqi, 28px); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.pv-welcome p { color: var(--muted-foreground); font-size: 15px; }
.preview .cap { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted-foreground); }
.preview .cap svg { width: 16px; height: 16px; }
.pv { max-width: 640px; width: 100%; overflow: hidden; }
.pv-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.pv-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--muted); }
.pv-head h2 { font-family: var(--font-heading); font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.pv-head p { font-size: 13px; color: var(--muted-foreground); }
.pv-cols, .pv-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) minmax(0, .9fr) auto; gap: 12px; align-items: center; padding: 0 20px; }
.pv-cols { min-height: 36px; font-size: 12px; font-weight: 600; color: var(--muted-foreground); background: var(--muted); }
.pv-row { min-height: 56px; border-top: 1px solid var(--border); font-size: 15px; position: relative; }
.pv-row.hl { background: var(--accent); }
.pv-row.hl::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
.pv-row .sub { font-size: 13px; color: var(--muted-foreground); }
.pv-row .ghost { color: var(--muted-foreground); }
.pv-empty { padding: 28px 20px; font-size: 14px; color: var(--muted-foreground); text-align: center; }
.skeleton { display: inline-block; height: 10px; border-radius: 999px; background: var(--muted); }
.pv-note { max-width: 640px; font-size: 13px; color: var(--muted-foreground); }
/* A narrow preview (tablet) leaves out the rent column and stacks the head. */
@container (max-width: 480px) {
  .pv-cols, .pv-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; padding: 0 14px; }
  .pv-cols > :nth-child(3), .pv-row > :nth-child(3) { display: none; }
  .pv-head { padding: 14px; }
  .pv-row .badge { padding: 2px 6px; }
}

/* ---------- Responsive overrides (after the base rules, so they win) ---------- */
.unit-list { container-type: inline-size; }
@container (max-width: 440px) {
  .unit-row { grid-template-columns: minmax(0, 1fr) 44px; }
  .unit-row .segmented { grid-column: 1 / 2; grid-row: 2; }
}
@media (min-width: 768px) {
  .body, .hero, .steps, .action-footer { padding-left: 28px; padding-right: 28px; }
  .top { padding-left: 28px; padding-right: 28px; }
  .hero { justify-content: center; }
}
@media (min-width: 1024px) {
  .body, .hero, .steps, .action-footer { padding-left: 40px; padding-right: 40px; }
  .top { padding-left: 40px; padding-right: 40px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="base.js"></script>
<script>
const ORDER = ['welcome', 'property', 'units', 'lease', 'done'];
const STEP = { property: 1, units: 2, lease: 3 };
const STEP_NAMES = ['Inmueble', 'Unidades', 'Contrato'];

function stepper(step) {
  return `<div class="steps" role="img" aria-label="Paso ${step} de 3: ${STEP_NAMES[step - 1]}">
    ${STEP_NAMES.map((name, i) => {
      const state = i + 1 < step ? 'done' : i + 1 === step ? 'now' : '';
      return `<div class="step ${state}"><div class="bar"></div><span class="lbl">${state === 'done' ? icon('check', 14) : ''}${name}</span></div>`;
    }).join('')}
  </div>`;
}
const topBar = (right = '') => `<div class="top">${brand(24)}${right}</div>`;

/* ---------- Screens ---------- */
function welcome() {
  return `${topBar()}<div class="hero ${enterClass()}">
    <div class="intro">
      <p class="eyebrow">Hola, ${OWNER.first}</p>
      <h1 class="font-heading">Organicemos tu primer inmueble</h1>
      <p class="lead">Tres pasos y unos 3 minutos. Al final tendrás todo listo para cobrar cada mes.</p>
    </div>
    <ol class="plan">
      <li><span class="n">1</span><p><b>Tu inmueble</b><span>Nombre, tipo y dirección.</span></p></li>
      <li><span class="n">2</span><p><b>Sus unidades</b><span>Cada espacio que cobras por separado.</span></p></li>
      <li><span class="n">3</span><p><b>Tu primer contrato</b><span>Arrendatario, canon y día de pago. Lo puedes dejar para después.</span></p></li>
    </ol>
  </div>
  <div class="action-footer"><a class="btn btn-primary" href="#property">Empezar ${icon('arrow-right')}</a></div>`;
}

function property() {
  return `${topBar()}${stepper(1)}
  <form class="body ${enterClass()}" id="form" novalidate>
    <div class="intro"><h1 class="text-title-onboarding">¿Qué inmueble arriendas?</h1><p>Empieza con uno. Después puedes agregar más.</p></div>
    ${toggleGroup({ path: 'property.type', label: 'Tipo', options: PROPERTY_TYPES, cols: 2, withIcons: true })}
    ${field({ path: 'property.name', label: 'Nombre del inmueble', placeholder: 'Casa La Soledad', help: 'Un nombre corto para reconocerlo.' })}
    ${field({ path: 'property.address', label: 'Dirección', placeholder: 'Calle, número y barrio', optional: true, autocomplete: 'street-address' })}
    ${field({ path: 'property.city', label: 'Ciudad', optional: true, autocomplete: 'address-level2' })}
  </form>
  <div class="action-footer"><button class="btn btn-primary" data-act="next">Continuar</button></div>`;
}

function units() {
  return `${topBar()}${stepper(2)}
  <form class="body ${enterClass()}" id="form" novalidate>
    <div class="intro"><h1 class="text-title-onboarding">¿Qué espacios arriendas en ${esc(draft.property.name)}?</h1><p>Cada espacio que cobras por separado es una unidad.</p></div>
    <div class="unit-list">
      ${draft.units.map((u, i) => `
        <div class="field">
          <label class="sr-only" for="units-${i}-name">Nombre de la unidad ${i + 1}</label>
          <div class="unit-row">
            <input class="input" id="units-${i}-name" data-bind="units.${i}.name" value="${esc(u.name)}" placeholder="Apto ${i + 1}" autocomplete="off" ${invalid(`units.${i}.name`)}>
            <div class="segmented" role="radiogroup" aria-label="Uso de la unidad ${i + 1}">
              ${UNIT_USES.map((o) => `<button type="button" role="radio" aria-pressed="${u.use === o.value}" aria-checked="${u.use === o.value}" data-use="${i}" data-value="${o.value}">${o.label}</button>`).join('')}
            </div>
            <button type="button" class="icon-btn" data-remove="${i}" aria-label="Quitar ${esc(u.name || `la unidad ${i + 1}`)}" ${draft.units.length === 1 ? 'disabled' : ''}>${icon('x')}</button>
          </div>${errorText(`units.${i}.name`)}
        </div>`).join('')}
    </div>
    <div class="quick" aria-label="Agregar unidad">
      <button type="button" class="chip" data-add="residential">${icon('plus')}Apartamento</button>
      <button type="button" class="chip" data-add="commercial">${icon('plus')}Local</button>
    </div>
    <p class="help">Suma ${draft.units.length} ${draft.units.length === 1 ? 'unidad' : 'unidades'}. Puedes agregar más después, desde Inmuebles.</p>
  </form>
  <div class="action-footer"><div class="footer-row"><button class="btn btn-outline" data-act="back">Atrás</button><button class="btn btn-primary" data-act="next">Continuar</button></div></div>`;
}

function lease() {
  const unitOptions = draft.units.map((u, i) => ({ value: String(i), label: u.name }));
  const picker = draft.units.length <= 6
    ? `<fieldset class="field"><legend class="legend" style="margin-bottom:6px">¿Qué unidad?</legend><div class="unit-pick" role="radiogroup">${unitOptions.map((o) => `<button type="button" class="toggle" role="radio" aria-checked="${String(draft.lease.unit) === o.value}" data-pick="lease.unit" data-value="${o.value}">${esc(o.label)}</button>`).join('')}</div></fieldset>`
    : selectField({ path: 'lease.unit', label: '¿Qué unidad?', options: unitOptions });
  return `${topBar()}${stepper(3)}
  <form class="body ${enterClass()}" id="form" novalidate>
    <div class="intro"><h1 class="text-title-onboarding">Tu primer contrato</h1><p>Con estos datos generamos la cuenta de cobro cada mes.</p></div>
    ${picker}
    <section class="group"><h2 class="group-title">${icon('user')}Arrendatario</h2>
      ${field({ path: 'lease.tenant_name', label: 'Nombre', placeholder: 'Nombre completo o razón social' })}
      ${field({ path: 'lease.tenant_email', label: 'Correo', type: 'email', inputmode: 'email', placeholder: 'nombre@correo.com', help: 'Aquí le llegan la cuenta y los recordatorios.' })}
    </section>
    <section class="group"><h2 class="group-title">${icon('banknote')}Cobro</h2>
      <div class="row-2">${moneyField({ path: 'lease.rent', label: 'Canon mensual' })}${selectField({ path: 'lease.due_day', label: 'Día de pago', options: DUE_DAYS, placeholder: 'Elige' })}</div>
    </section>
    <section class="group"><h2 class="group-title">${icon('calendar')}Vigencia</h2>
      <div class="row-2">${field({ path: 'lease.start_date', label: 'Inicio', type: 'date' })}${field({ path: 'lease.end_date', label: 'Fin', type: 'date', optional: true })}</div>
    </section>
    <section class="group"><h2 class="group-title">${icon('file')}Documento</h2>${documentPicker()}</section>
  </form>
  <div class="action-footer">
    <div class="footer-row"><button class="btn btn-outline" data-act="back">Atrás</button><button class="btn btn-primary" data-act="finish">Crear y terminar</button></div>
    <button class="btn btn-ghost btn-sm" data-act="skip">Agregar los contratos después</button>
  </div>`;
}

function done() {
  const l = draft.lease;
  const unitName = draft.units[l.unit]?.name;
  return `${topBar()}<div class="hero ${enterClass()}">
    <div class="ok">${icon('check')}</div>
    <div class="intro"><h1 class="font-heading">Listo, ${OWNER.first}</h1><p class="lead">${draft.withLease ? `${esc(draft.property.name)} quedó con ${draft.units.length} unidades y el contrato de ${esc(unitName)}.` : `${esc(draft.property.name)} quedó con ${draft.units.length} unidades. Los contratos los agregas desde cada unidad.`}</p></div>
    <dl class="card recap">
      <div><dt>Inmueble</dt><dd>${esc(draft.property.name)}</dd></div>
      <div><dt>Unidades</dt><dd>${draft.units.map((u) => esc(u.name)).join(', ')}</dd></div>
      ${draft.withLease ? `<div><dt>Contrato</dt><dd>${esc(unitName)} · ${esc(l.tenant_name)}</dd></div><div><dt>Canon</dt><dd>${pesos(l.rent)} · el ${l.due_day}</dd></div>` : ''}
    </dl>
  </div>
  <div class="action-footer"><button class="btn btn-primary" data-act="home">Ir al resumen</button>${draft.units.length > 1 ? '<button class="btn btn-ghost btn-sm" data-act="home">Agregar otro contrato</button>' : ''}</div>`;
}

/* ---------- The live preview (desktop): the property as Inmuebles will show it ---------- */
function previewPanel() {
  const p = draft.property;
  const type = PROPERTY_TYPES.find((t) => t.value === p.type);
  const where = [p.address, p.city].filter(Boolean).join(' · ');
  const leaseOn = (current === 'lease' || current === 'done') && draft.withLease;
  const rows = draft.units.map((u, i) => {
    const hasLease = leaseOn && Number(draft.lease.unit) === i;
    const l = draft.lease;
    return `<div class="pv-row${hasLease ? ' hl' : ''}">
      <div><b>${esc(u.name) || '<span class="ghost">Sin nombre</span>'}</b><div class="sub">${useLabel(u.use)}</div></div>
      <div>${hasLease ? `${esc(l.tenant_name) || '<span class="ghost">Arrendatario</span>'}<div class="sub">${l.due_day ? `Paga el ${l.due_day}` : 'Día de pago'}</div>` : '<span class="ghost">—</span>'}</div>
      <div>${hasLease && l.rent ? pesos(l.rent) : '<span class="ghost">—</span>'}</div>
      <div>${hasLease ? `<span class="badge tone-positive">${icon('check')}Al día</span>` : `<span class="badge tone-neutral">${icon('key')}Disponible</span>`}</div>
    </div>`;
  }).join('');
  const intro = current === 'welcome'
    ? `<div class="pv-welcome"><h2>Al terminar, tu inmueble se verá así</h2><p>Con sus unidades, quién arrienda cada una y si está al día.</p></div>`
    : current === 'done'
      ? `<div class="pv-welcome"><h2>Ya está en Inmuebles</h2><p>Las unidades disponibles esperan su contrato.</p></div>`
      : `<p class="cap">${icon('eye')}Así quedará en Inmuebles</p>`;
  return `${intro}
  <div class="card pv" aria-live="polite">
    <div class="pv-head"><span class="pv-ic">${icon(type?.icon ?? 'house', 22)}</span><div><h2>${esc(p.name) || '<span class="skeleton" style="width:160px"></span>'}</h2><p>${type ? type.label : 'Tipo'}${where ? ` · ${esc(where)}` : ''}</p></div></div>
    ${current === 'welcome' ? `<div class="pv-cols"><span>Unidad</span><span>Arrendatario</span><span>Canon</span><span>Estado</span></div>${[70, 55, 62].map((w) => `<div class="pv-row"><div><span class="skeleton" style="width:${w}%"></span></div><div><span class="skeleton" style="width:60%"></span></div><div><span class="skeleton" style="width:70%"></span></div><div><span class="skeleton" style="width:64px;height:20px"></span></div></div>`).join('')}` : current === 'property' ? '<p class="pv-empty">En el siguiente paso agregas sus unidades.</p>' : `<div class="pv-cols"><span>Unidad</span><span>Arrendatario</span><span>Canon</span><span>Estado</span></div>${rows}`}
  </div>
  ${STEP[current] ? '<p class="pv-note">Nada se guarda hasta el último paso: ahí creamos el inmueble, sus unidades y el contrato de una vez.</p>' : ''}`;
}

/* ---------- Render and actions ---------- */
function render() {
  const view = { welcome, property, units, lease, done }[current]();
  document.getElementById('app').innerHTML = `<div class="shell"><div class="flow">${view}</div><aside class="preview" aria-label="Vista previa">${previewPanel()}</aside></div>${themeButton()}`;
}
onDraftChange = () => { const pv = document.querySelector('.preview'); if (pv) pv.innerHTML = previewPanel(); };

document.addEventListener('click', (event) => {
  const t = event.target.closest('button, a');
  if (!t) return;
  if (t.dataset.use) {
    draft.units[+t.dataset.use].use = t.dataset.value;
    t.parentElement.querySelectorAll('button').forEach((b) => { const on = b === t; b.setAttribute('aria-pressed', on); b.setAttribute('aria-checked', on); });
    onDraftChange();
    return;
  }
  if (t.dataset.add) {
    draft.units.push({ name: suggestUnitName(t.dataset.add, draft.units), use: t.dataset.add });
    render();
    document.getElementById(`units-${draft.units.length - 1}-name`)?.focus();
    return;
  }
  if (t.dataset.remove) {
    draft.units.splice(+t.dataset.remove, 1);
    if (draft.lease.unit >= draft.units.length) draft.lease.unit = 0;
    errors = {};
    render();
    return;
  }
  const act = t.dataset.act;
  if (!act) return;
  event.preventDefault();
  const step = current;
  if (act === 'back') back(ORDER[ORDER.indexOf(step) - 1]);
  if (act === 'next') {
    if (validate(step)) go(ORDER[ORDER.indexOf(step) + 1]);
    else { render(); focusFirstError(); }
  }
  if (act === 'finish') {
    draft.withLease = true;
    if (validate('lease')) go('done');
    else { render(); focusFirstError(); }
  }
  if (act === 'skip') { draft.withLease = false; go('done'); }
  if (act === 'home') toast('Aquí la app abre el resumen.');
});
document.addEventListener('submit', (event) => { event.preventDefault(); document.querySelector('[data-act="next"], [data-act="finish"]')?.click(); });

startRouter(ORDER, { welcome: 0, property: 1, units: 2, lease: 3, done: 3 });
</script>
</body>
</html>
