<style>
/* ---------- Primitive tokens: brand (docs/new-brand-design/brand-design.md) ---------- */
:root {
  --brand-navy: #14264C;
  --brand-green: #28B779;
  --brand-yellow: #FFC857;
  --brand-ivory: #F4F1E8;

  /* Primitive tokens: derived from the brand */
  --navy-950: #0A1122;
  --navy-900: #0C1528;
  --navy-800: #14203B;
  --navy-700: #1B2A4B;
  --navy-600: #2A3A60;
  --navy-400: #55607A;
  --navy-300: #A9B3CC;
  --ivory-50: #FBF9F3;
  --ivory-200: #EDE8DA;
  --ivory-300: #DDD6C3;
  --brick: #BC3D28;

  --font-display: "Red Hat Display", Inter, system-ui, sans-serif;
  --font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Semantic tokens: bill status. fill = marks, ink = text, bg = tinted surface */
  --st-paid: #1FA36C;      --st-paid-ink: #14734B;     --st-paid-bg: #DDF3E8;
  --st-partial: #D4951A;   --st-partial-ink: #7A5200;  --st-partial-bg: #FFEFC9;
  --st-pending: #4C6FC4;   --st-pending-ink: #2F4A94;  --st-pending-bg: #E1E8F8;
  --st-overdue: #D2513A;   --st-overdue-ink: #A3321E;  --st-overdue-bg: #FADFD8;
  --st-voided: #8A90A0;    --st-voided-ink: #565D70;   --st-voided-bg: #E7E8EC;
  --focus: #2F4A94;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --st-paid: #25A870;      --st-paid-ink: #6BDDAA;     --st-paid-bg: rgba(37, 168, 112, .18);
  --st-partial: #C08618;   --st-partial-ink: #FFC857;  --st-partial-bg: rgba(255, 200, 87, .15);
  --st-pending: #6485DA;   --st-pending-ink: #A9BEF5;  --st-pending-bg: rgba(100, 133, 218, .2);
  --st-overdue: #E05F47;   --st-overdue-ink: #FF9D88;  --st-overdue-bg: rgba(224, 95, 71, .2);
  --st-voided: #7C87A3;    --st-voided-ink: #A9B3CC;   --st-voided-bg: rgba(255, 255, 255, .08);
  --focus: #FFC857;
  color-scheme: dark;
}
.st-paid    { --st: var(--st-paid);    --st-ink: var(--st-paid-ink);    --st-bg: var(--st-paid-bg); }
.st-partial { --st: var(--st-partial); --st-ink: var(--st-partial-ink); --st-bg: var(--st-partial-bg); }
.st-pending { --st: var(--st-pending); --st-ink: var(--st-pending-ink); --st-bg: var(--st-pending-bg); }
.st-overdue { --st: var(--st-overdue); --st-ink: var(--st-overdue-ink); --st-bg: var(--st-overdue-bg); }
.st-voided  { --st: var(--st-voided);  --st-ink: var(--st-voided-ink);  --st-bg: var(--st-voided-bg); }

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.5; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a[href], label, select { cursor: pointer; }
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); letter-spacing: -.02em; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; background: var(--st-bg); color: var(--st-ink); }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); z-index: 90; max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 12px; background: var(--toast-bg, var(--brand-navy)); color: var(--toast-ink, var(--brand-ivory)); font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(10, 17, 34, .28); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}


/* ---------- Proposal B · Libro: semantic tokens ---------- */
:root {
  --bg: #F5F6F9;
  --surface: #FFFFFF;
  --surface-2: #EEF0F5;
  --line: #DFE3EC;
  --ink: var(--brand-navy);
  --ink-2: var(--navy-400);
  --primary: var(--brand-navy);
  --on-primary: var(--brand-ivory);
  --danger: var(--st-overdue-ink);
  --rail: var(--brand-navy);
  --on-rail: var(--brand-ivory);
  --rail-muted: var(--navy-300);
  --rail-active: rgba(244, 241, 232, .12);
  --selected: #E9EDF7;
  --bar: var(--brand-navy);
  --scrim: rgba(20, 38, 76, .4);
  --shadow: 0 1px 2px rgba(20, 38, 76, .06);
}
:root[data-theme="dark"] {
  --bg: var(--navy-950);
  --surface: #111B33;
  --surface-2: #18243F;
  --line: #26345A;
  --ink: var(--brand-ivory);
  --ink-2: var(--navy-300);
  --primary: var(--brand-ivory);
  --on-primary: var(--brand-navy);
  --rail: #0E1830;
  --selected: #1D2B4D;
  --bar: #8FA6E6;
  --scrim: rgba(4, 8, 18, .7);
  --shadow: none;
  --toast-bg: var(--brand-ivory);
  --toast-ink: var(--brand-navy);
}
body { font-size: 15px; }

/* ---------- Shell: rail · list · pane ---------- */
.app { min-height: 100dvh; display: flex; flex-direction: column; }
.mtop { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 20px; letter-spacing: -.03em; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; }
.icon-btn:hover { background: var(--surface-2); }
.rail { position: fixed; inset: auto 0 0 0; z-index: 20; display: flex; background: var(--rail); color: var(--rail-muted); padding-bottom: env(safe-area-inset-bottom); }
.rail .brand, .rail .foot { display: none; }
.rail nav { display: flex; flex: 1; }
.rail .tab { position: relative; flex: 1; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; }
.rail .tab[aria-current] { color: var(--on-rail); }
.rail .tab[aria-current]::before { content: ""; position: absolute; top: 0; left: 50%; width: 28px; height: 3px; margin-left: -14px; border-radius: 0 0 3px 3px; background: var(--brand-green); }
main { flex: 1; min-width: 0; padding: 20px 16px 96px; container: view / inline-size; }
.pane { position: fixed; inset: 0; z-index: 30; background: var(--surface); overflow-y: auto; animation: slide .24s cubic-bezier(.2, .8, .2, 1); }
@keyframes slide { from { transform: translateX(32px); opacity: 0; } }

@media (min-width: 768px) {
  .app { display: grid; grid-template-columns: 68px minmax(0, 1fr); }
  .app.has-pane { grid-template-columns: 68px minmax(0, 1fr) 372px; }
  .mtop { display: none; }
  .rail { position: sticky; inset: 0 auto auto 0; height: 100dvh; flex-direction: column; align-items: center; padding: 16px 0; gap: 18px; }
  .rail .brand { display: flex; color: var(--on-rail); }
  .rail nav { flex: none; flex-direction: column; gap: 4px; width: 100%; padding: 0 6px; }
  .rail .tab { flex: none; min-height: 54px; border-radius: 10px; font-size: 10.5px; }
  .rail .tab:hover { color: var(--on-rail); }
  .rail .tab[aria-current] { background: var(--rail-active); }
  .rail .tab[aria-current]::before { top: 50%; left: -6px; width: 3px; height: 24px; margin: -12px 0 0; border-radius: 0 3px 3px 0; }
  .rail .foot { display: flex; flex-direction: column; margin-top: auto; }
  .rail .icon-btn:hover { background: var(--rail-active); color: var(--on-rail); }
  main { padding: 24px 24px 48px; }
  .pane { position: sticky; top: 0; height: 100dvh; border-left: 1px solid var(--line); z-index: 1; }
}
@media (min-width: 1200px) {
  .app.has-pane { grid-template-columns: 68px minmax(0, 1fr) 408px; }
  main { padding: 28px 32px 56px; }
  .app:not(.has-pane) main { max-width: 1240px; margin: 0 auto; width: 100%; }
}

/* ---------- Primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s ease; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { opacity: .9; }
.btn.block { width: 100%; }
.btn.danger { color: var(--danger); }
@media (min-width: 768px) and (pointer: fine) { .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; } .icon-btn.sm { width: 36px; height: 36px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.sec { margin-top: 26px; }
.prop-acts { display: flex; gap: 6px; flex: none; }
.sec-head:has(.prop-acts) { flex-wrap: wrap; }
.sec-head:has(.prop-acts) > :first-child { flex: 1 1 240px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; min-height: 28px; }
.mock-note { margin-top: 36px; font-size: 12px; color: var(--ink-2); }
.mock-note a { text-decoration: underline; }

/* ---------- Summary ---------- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.kpi { padding: 14px 16px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin: -1px 0 0 -1px; }
.kpi dt { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.kpi dd { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.25; letter-spacing: -.02em; }
.kpi small { display: block; font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
.charts { display: grid; gap: 12px; margin-top: 12px; }
.chart { padding: 16px; }
.chart h3 { font-size: 14px; font-weight: 600; }
.chart .sub { font-size: 12px; color: var(--ink-2); margin-bottom: 14px; }
.compo { display: flex; gap: 2px; height: 22px; }
.compo span { min-width: 6px; background: var(--st); transition: opacity .15s ease; }
.compo span:first-child { border-radius: 4px 0 0 4px; }
.compo span:last-child { border-radius: 0 4px 4px 0; }
.compo:hover span:not(:hover) { opacity: .45; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 14px; }
.legend li { display: grid; grid-template-columns: 10px 1fr; gap: 0 8px; align-items: center; font-size: 13px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--st); }
.legend b { grid-column: 2; font-weight: 600; font-size: 14px; }
.legend em { font-style: normal; font-weight: 400; color: var(--ink-2); font-size: 12px; }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; align-items: end; height: 132px; border-bottom: 1px solid var(--line); }
.bars li { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 12px; font-weight: 600; }
.bars .col { position: relative; width: 28px; flex: none; border-radius: 4px 4px 0 0; background: var(--surface-2); }
.bars .col span { position: absolute; inset: auto 0 0 0; border-radius: 4px 4px 0 0; background: var(--bar); }
.bars-x { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; padding-top: 6px; text-align: center; font-size: 12px; color: var(--ink-2); }
@container view (min-width: 720px) { .charts { grid-template-columns: 1.6fr 1fr; } }
@container view (min-width: 1040px) { .legend { grid-template-columns: repeat(4, auto); justify-content: space-between; } }
@media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
#tip { position: fixed; z-index: 95; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 500; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); opacity: 0; transition: opacity .12s ease; }
#tip.on { opacity: 1; }

/* ---------- Ledger table ---------- */
.tbl { container-type: inline-size; overflow: hidden; }
.th, .tr-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
.th { display: none; }
.tr { display: flex; align-items: stretch; border-top: 1px solid var(--line); position: relative; }
.tr:first-child { border-top: 0; }
.tr::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--st); }
.tr-main { flex: 1; min-width: 0; padding: 10px 14px 10px 16px; min-height: 56px; }
.tr-main:hover { background: var(--surface-2); }
.tr.sel .tr-main { background: var(--selected); }
.c-who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-who span { font-weight: 400; color: var(--ink-2); }
.c-amt { text-align: right; font-weight: 600; white-space: nowrap; }
.c-amt small { font-size: 11px; font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.c-meta { font-size: 13px; color: var(--ink-2); }
.c-st { justify-self: end; }
.c-no, .c-due, .tr-act { display: none; }
.grp { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 13px; }
.grp:first-child { border-top: 0; }
.grp b { font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
@container (min-width: 600px) {
  .th, .tr-main { grid-template-columns: minmax(0, 1.6fr) 92px 104px 116px; gap: 12px; }
  .th { display: grid; padding: 9px 14px 9px 16px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line); }
  .th.act { padding-right: 190px; }
  .th span:nth-last-child(2) { text-align: right; }
  .tr-main { min-height: 50px; padding-block: 6px; }
  .c-meta { display: none; }
  .c-due { display: block; font-size: 14px; }
  .c-due small { display: block; font-size: 12px; color: var(--ink-2); }
  .c-st { justify-self: start; }
  .tr-act { display: flex; align-items: center; justify-content: flex-end; gap: 6px; width: 176px; padding-right: 12px; flex: none; }
}
@container (min-width: 800px) {
  .th, .tr-main { grid-template-columns: minmax(0, 1.6fr) 84px 104px 116px 116px; }
  .c-no { display: block; color: var(--ink-2); font-size: 14px; }
  .th .c-no { font-size: 12px; }
}
/* Units table reuses the ledger with its own columns */
.units .c-tenant { display: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@container (min-width: 600px) {
  .units .th, .units .tr-main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 150px 124px; }
  .units .c-tenant { display: block; }
  .units .c-meta { display: none; }
}

/* ---------- Filters ---------- */
.filters { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.segs { display: flex; padding: 3px; border-radius: 12px; background: var(--surface-2); flex: none; }
.segs button { min-height: 40px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.segs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.segs .n { font-weight: 500; opacity: .7; margin-left: 4px; }
.select { min-height: 44px; padding: 0 32px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; appearance: none; flex: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
@media (min-width: 768px) { .filters { margin-inline: 0; padding-inline: 2px; } }

/* ---------- Pane: bill detail and payment ---------- */
.pane-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
.pane-head .ttl { flex: 1; min-width: 0; }
.pane-head .ttl b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.2; }
.pane-head .ttl span { display: block; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-body { padding: 18px 16px 32px; display: grid; gap: 22px; }
.bal .figure { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -.03em; }
.bal .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.bal .btn.primary { margin-top: 14px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 8px 12px; font-size: 14px; margin-top: 10px; }
.kv dt { color: var(--ink-2); }
.kv dd { font-weight: 500; }
.items { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
.items td, .items th { padding: 8px 0; border-top: 1px solid var(--line); text-align: left; font-weight: 400; }
.items td:last-child, .items th:last-child { text-align: right; white-space: nowrap; }
.items tfoot th { font-weight: 600; border-top: 2px solid var(--ink); }
.tl { margin-top: 12px; }
.tl li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 16px; position: relative; }
.tl li:last-child { padding-bottom: 0; }
.tl li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--line); }
.tl .dot { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--st-bg, var(--surface-2)); color: var(--st-ink, var(--ink)); }
.tl p { font-weight: 500; font-size: 14px; }
.tl small { display: block; font-size: 13px; color: var(--ink-2); }
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label, .field legend { font-size: 13px; font-weight: 600; padding: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.input { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.input.amount { min-height: 58px; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.hint.st-paid, .hint.st-partial { color: var(--st-ink); font-weight: 600; }
.seg4 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg4 label { position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.seg4 input, .check input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg4 label:has(input:checked) { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.seg4 label:has(input:focus-visible), .check:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

const navHTML = (current) => NAV.map(([key, label, icon]) => key === 'settings'
  ? `<button class="tab" data-act="toast" data-msg="Ajustes no hace parte de este mock">${ic(icon, 21)}${label}</button>`
  : `<a class="tab" href="#${key}" ${current === key ? 'aria-current="page"' : ''}>${ic(icon, 21)}${label}</a>`).join('');

/** One ledger line. `actions` adds the in-row buttons of the summary. */
function billRow(b, actions) {
  const u = billUnit(b);
  const open = isOpen(b);
  const sel = (ROUTE.name === 'bill' || ROUTE.name === 'pay') && +ROUTE.arg === b.id;
  const acts = actions ? `<div class="tr-act">${b.status === 'overdue' ? `<button class="icon-btn sm" data-act="remind" data-id="${b.id}" aria-label="Enviar recordatorio a ${u.short}" data-tip="Enviar recordatorio">${ic('bell', 17)}</button>` : ''}<a class="btn primary sm" href="#pay/${b.id}">Registrar pago</a></div>` : '';
  return `<li class="tr st-${b.status} ${sel ? 'sel' : ''}">
    <a class="tr-main" href="#bill/${b.id}" ${sel ? 'aria-current="true"' : ''}>
      <span class="c-who">${u.name} <span>· ${u.tenant}</span></span>
      <span class="c-no num">${billNo(b.number)}</span>
      <span class="c-due num">${dayMonth(b.due)}${open ? `<small>${b.status === 'overdue' ? owedDetail(b) : b.status === 'partial' ? owedDetail(b) : ''}</small>` : ''}</span>
      <span class="c-amt num">${pesos(open ? b.balance : b.total)}${open && b.balance < b.total ? '<small>saldo</small>' : ''}</span>
      <span class="c-meta num">${billNo(b.number)} · ${open ? owedDetail(b) : 'venció ' + dayMonth(b.due)}</span>
      <span class="c-st">${badge(b.status)}</span>
    </a>${acts}
  </li>`;
}
const tableHead = (last, act) => `<div class="th ${act ? 'act' : ''}" aria-hidden="true"><span>Unidad y arrendatario</span><span class="c-no">Cuenta</span><span>Vence</span><span>${last}</span><span>Estado</span></div>`;

const SCREENS = {
  home() {
    const s = summary();
    const months = PERIODS().reverse().map(summary);
    const top = Math.max(...months.map((m) => m.expected));
    return `<div class="head"><div><h1>${monthTitle(s.period)}</h1><p class="muted small">Corte al ${fullDate(TODAY)} · ${OWNER.name}</p></div>
        <button class="btn primary" data-act="toast" data-msg="Crear una cuenta manual no hace parte de este mock">${ic('plus', 17)}Nueva cuenta</button></div>
      <dl class="card kpis" aria-label="Resumen del mes">
        <div class="kpi"><dt>Esperado</dt><dd class="num">${pesos(s.expected)}</dd></div>
        <div class="kpi"><dt>Recaudado</dt><dd class="num">${pesos(s.collected)}<small>${s.percent} % del mes</small></dd></div>
        <div class="kpi"><dt>Pendiente</dt><dd class="num">${pesos(s.pending)}<small>${s.receivable.length} cuentas</small></dd></div>
        <div class="kpi"><dt>En mora</dt><dd class="num">${s.unitsOverdue} de ${s.unitsTotal}<small>unidades</small></dd></div>
      </dl>
      <div class="charts">
        <figure class="card chart">
          <h3>Cómo va ${monthName(s.period)}</h3><p class="sub">Los ${pesos(s.expected)} esperados, según el estado de cada cuenta</p>
          <div class="compo" role="img" aria-label="${s.segments.map((g) => `${g.label}: ${pesos(g.value)}`).join(', ')}">${s.segments.filter((g) => g.value).map((g) => `<span class="st-${g.key}" style="flex:${g.value}" data-tip="${g.label} · ${pesos(g.value)} · ${Math.round((g.value / s.expected) * 100)} %"></span>`).join('')}</div>
          <ul class="legend">${s.segments.map((g) => `<li class="st-${g.key}"><i></i><span>${g.label}</span><b class="num">${pesos(g.value)} <em>${Math.round((g.value / s.expected) * 100)} %</em></b></li>`).join('')}</ul>
        </figure>
        <figure class="card chart">
          <h3>Recaudo por mes</h3><p class="sub">Recaudado sobre lo esperado</p>
          <ul class="bars">${months.map((m) => `<li><span class="num">${(m.collected / 1e6).toFixed(1).replace('.', ',')} M</span><span class="col" style="height:${(m.expected / top) * 78}%" data-tip="${monthTitle(m.period)} · ${pesos(m.collected)} de ${pesos(m.expected)}"><span style="height:${m.percent}%"></span></span></li>`).join('')}</ul>
          <div class="bars-x">${months.map((m) => `<span>${monthName(m.period).slice(0, 3)}</span>`).join('')}</div>
        </figure>
      </div>
      <section class="sec" aria-labelledby="h-owed">
        <div class="sec-head"><h2 id="h-owed">Por cobrar · ${s.receivable.length}</h2><span class="small muted">Lo más urgente primero</span></div>
        <div class="card tbl">${tableHead('Saldo', true)}<ul>${s.receivable.map((b) => billRow(b, true)).join('') || `<li class="empty">Todo cobrado este mes.</li>`}</ul></div>
      </section>
      <section class="sec" aria-labelledby="h-paid">
        <div class="sec-head"><h2 id="h-paid">Pagadas este mes · ${s.paid.length}</h2><a class="btn sm" href="#bills">Ver todas</a></div>
        <div class="card tbl">${tableHead('Valor')}<ul>${s.paid.map((b) => billRow(b)).join('')}</ul></div>
      </section>`;
  },

  bills() {
    const match = STATUS_FILTERS.find((f) => f[0] === FILTER.status)[2];
    const inUnit = (b) => FILTER.unit === 'all' || b.unit === FILTER.unit;
    const groups = PERIODS().map((period) => {
      const list = BILLS.filter((b) => b.period === period && match(b) && inUnit(b)).sort(byUrgency);
      if (!list.length) return '';
      const s = summary(period);
      return `<li class="grp"><b>${monthTitle(period)}</b><span class="muted num">${pesos(s.collected)} de ${pesos(s.expected)} · ${s.percent} %</span></li>${list.map((b) => billRow(b)).join('')}`;
    }).join('');
    return `<div class="head"><div><h1>Cuentas</h1><p class="muted small">${BILLS.length} cuentas en ${PERIODS().length} meses</p></div>
        <button class="btn primary" data-act="toast" data-msg="Crear una cuenta manual no hace parte de este mock">${ic('plus', 17)}Nueva cuenta</button></div>
      <div class="filters">
        <div class="segs" role="group" aria-label="Filtrar por estado">${STATUS_FILTERS.map(([k, l, f]) => `<button data-act="filter" data-status="${k}" aria-pressed="${FILTER.status === k}">${l}<span class="n num">${BILLS.filter((b) => f(b) && inUnit(b)).length}</span></button>`).join('')}</div>
        <label class="sr-only" for="f-unit">Filtrar por unidad</label>
        <select class="select" id="f-unit" data-filter-unit><option value="all">Todas las unidades</option>${UNITS.filter((u) => u.tenant).map((u) => `<option value="${u.id}" ${FILTER.unit === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}</select>
      </div>
      <div class="card tbl">${tableHead('Valor')}<ul>${groups || `<li class="empty">No hay cuentas con ese filtro.</li>`}</ul></div>`;
  },

  properties() {
    const blocks = PROPERTIES.map((p) => {
      const rows = UNITS.filter((u) => u.p === p.id).map((u) => {
        const key = unitStatus(u), st = UNIT_STATUS[key];
        const inner = `<span class="c-who">${u.name} <span>· ${u.use}</span></span>
          <span class="c-tenant">${u.tenant || '<span class="muted">Sin contrato</span>'}</span>
          <span class="c-amt num">${u.tenant ? pesos(u.rent) : '—'}${u.tenant ? `<small>día ${u.day}</small>` : ''}</span>
          <span class="c-meta">${u.tenant || 'Sin contrato'}</span>
          <span class="c-st"><span class="badge st-${st.st}">${ic(st.icon, 13, 2.5)}${st.label}</span></span>`;
        const sel = ROUTE.name === 'unit' && ROUTE.arg === u.id;
        return `<li class="tr st-${st.st} ${sel ? 'sel' : ''}"><a class="tr-main" href="#unit/${u.id}" ${sel ? 'aria-current="true"' : ''}>${inner}</a></li>`;
      }).join('');
      return `<section class="sec"><div class="sec-head"><div><b style="font-family:var(--font-display);font-weight:800;font-size:17px">${p.name}</b><p class="small muted">${p.type} · ${p.address} · ${p.city}</p></div>
          <div class="prop-acts"><button class="btn sm" data-act="toast" data-msg="Editar ${p.name}: nombre, dirección, ciudad y tipo. No hace parte de este mock" aria-label="Editar ${p.name}">${ic('pencil', 15)}Editar</button><button class="btn sm" data-act="toast" data-msg="Agregar unidad no hace parte de este mock">${ic('plus', 16)}Unidad</button></div></div>
        <div class="card tbl units"><div class="th" aria-hidden="true"><span>Unidad</span><span>Arrendatario</span><span style="text-align:right">Canon</span><span>Estado</span></div><ul>${rows}</ul></div></section>`;
    }).join('');
    return `<div class="head"><div><h1>Inmuebles</h1><p class="muted small">${PROPERTIES.length} inmuebles · ${UNITS.length} unidades · ${UNITS.filter((u) => !u.tenant).length} disponible</p></div>
      <button class="btn primary" data-act="toast" data-msg="Agregar inmueble no hace parte de este mock">${ic('plus', 17)}Agregar inmueble</button></div>${blocks}`;
  },
};

function paneBill(b) {
  const u = billUnit(b), p = propById(u.p), open = isOpen(b);
  const line = b.status === 'paid' ? `Pagada el ${dayMonth(lastPayment(b).date)}` : b.status === 'overdue' ? `Venció el ${dayMonth(b.due)} · ${owedDetail(b)}` : `Vence el ${dayMonth(b.due)}`;
  return `<div class="pane-head"><button class="icon-btn" data-act="close" aria-label="Cerrar detalle">${ic('x', 20)}</button>
      <div class="ttl"><b class="num">Cuenta ${billNo(b.number)}</b><span>${u.name} · ${u.tenant}</span></div>${badge(b.status)}</div>
    <div class="pane-body">
      <section class="bal" aria-label="Saldo">
        <p class="small muted">${open ? 'Saldo por cobrar' : 'Total pagado'}</p>
        <p class="figure num">${pesos(open ? b.balance : b.total)}</p>
        <p class="small muted">${line}${open && b.balance < b.total ? ` · abonó ${pesos(b.total - b.balance)}` : ''}</p>
        ${open ? `<a class="btn primary block" href="#pay/${b.id}">Registrar pago</a>` : ''}
        <div class="acts">
          <button class="btn" data-act="toast" data-msg="Cuenta reenviada a ${u.short}">${ic('send', 16)}Reenviar</button>
          <button class="btn" data-act="toast" data-msg="Descargando ${billNo(b.number)}.pdf">${ic('download', 16)}PDF</button>
          <button class="btn danger" ${!open || b.payments.length ? `disabled style="opacity:.45;cursor:not-allowed" data-tip="${open ? 'Tiene pagos: no se puede anular' : 'Ya está pagada'}"` : 'data-act="toast" data-msg="Anular pide confirmación; no hace parte de este mock"'}>${ic('ban', 16)}Anular</button>
        </div>
      </section>
      <section><h2>Documento</h2>
        <dl class="kv"><dt>Arrendatario</dt><dd>${u.tenant}<br><span class="muted small">${u.doc}</span></dd><dt>Inmueble</dt><dd>${p.name} · ${u.name}</dd><dt>Periodo</dt><dd>${monthTitle(b.period)}</dd><dt>Emisión</dt><dd class="num">${fullDate(b.issue)}</dd><dt>Vencimiento</dt><dd class="num">${fullDate(b.due)}</dd></dl></section>
      <section><h2>Conceptos</h2>
        <table class="items"><tbody>${b.items.map((i) => `<tr><td>${i.desc}</td><td class="num">${pesos(i.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><th scope="row">Total</th><th class="num">${pesos(b.total)}</th></tr></tfoot></table></section>
      <section><h2>Historial</h2>
        <ol class="tl">${timeline(b).map((e) => `<li class="${e.tone ? 'st-' + e.tone : ''}"><span class="dot">${ic(e.icon, 15, 2.5)}</span><div><p>${e.text}</p><small class="num"><time datetime="${e.date}T${e.time}">${fullDate(e.date)} · ${clock(e.time)}</time>${e.sub ? ' · ' + e.sub : ''}</small></div></li>`).join('')}</ol></section>
    </div>`;
}
/** A unit and its lease: conditions, signed document and the bills of the contract. */
function paneUnit(u) {
  const p = propById(u.p), st = UNIT_STATUS[unitStatus(u)], l = LEASES[u.id];
  const head = `<div class="pane-head"><button class="icon-btn" data-act="close" aria-label="Cerrar detalle">${ic('x', 20)}</button>
      <div class="ttl"><b>${u.name}</b><span>${p.name} · ${u.use}</span></div><span class="badge st-${st.st}">${ic(st.icon, 13, 2.5)}${st.label}</span></div>`;
  if (!l) {
    return `${head}<div class="pane-body">
      <section class="vacant"><span class="vacant-ic">${ic('key', 22)}</span><b>Sin contrato</b>
        <p class="small muted">Esta unidad está disponible. Crea el contrato para empezar a generar sus cuentas de cobro.</p>
        <button class="btn primary block" data-act="toast" data-msg="Crear contrato no hace parte de este mock">${ic('plus', 17)}Crear contrato</button></section>
      <section><h2>Unidad</h2><dl class="kv"><dt>Inmueble</dt><dd>${p.name}</dd><dt>Uso</dt><dd>${u.use}</dd></dl><div class="row-acts"><button class="btn block" data-act="toast" data-msg="Editar ${u.name}: nombre y uso. No hace parte de este mock">${ic('pencil', 15)}Editar unidad</button></div></section>
    </div>`;
  }
  const bills = BILLS.filter((b) => b.unit === u.id).sort((a, b) => b.period.localeCompare(a.period));
  const left = daysBetween(TODAY, l.end);
  return `${head}<div class="pane-body">
      <section class="bal" aria-label="Canon">
        <p class="small muted">Canon mensual</p>
        <p class="figure num">${pesos(u.rent)}</p>
        <p class="small muted">Paga el día ${u.day} de cada mes</p>
      </section>
      <section><h2>Contrato</h2>
        <dl class="kv"><dt>Arrendatario</dt><dd>${u.tenant}<br><span class="muted small">${u.doc}</span></dd>
          <dt>Correo</dt><dd style="overflow-wrap:anywhere">${l.email}</dd>
          <dt>Inicio</dt><dd class="num">${fullDate(l.start)}</dd>
          <dt>Fin</dt><dd class="num">${fullDate(l.end)}${left <= 60 ? `<br><span class="badge st-partial" style="margin-top:4px">${ic('clock', 13, 2.5)}Termina en ${left} días</span>` : ''}</dd></dl>
        <label class="check" style="margin-top:8px"><input type="checkbox" ${l.auto ? 'checked' : ''} data-auto="${u.id}"><i>${ic('check', 15, 3)}</i><span>Enviar la cuenta automáticamente cada mes</span></label>
      </section>
      <section><h2>Documento firmado</h2>
        ${l.doc ? `<div class="file"><span class="file-ic">${ic('bills', 18)}</span><span class="file-name">${l.doc}</span>
            <button class="btn sm" data-act="toast" data-msg="Abriendo ${l.doc}">Ver</button><button class="btn sm" data-act="toast" data-msg="Aquí se reemplaza por un PDF, JPG o PNG">Reemplazar</button></div>`
          : `<button class="drop" style="margin-top:10px" data-act="toast" data-msg="Aquí se adjunta un PDF, JPG o PNG">${ic('clip', 17)}Sin documento. Adjuntar contrato firmado</button>`}
      </section>
      <section><h2>Cuentas del contrato · ${bills.length}</h2>
        <div class="card tbl" style="margin-top:10px"><ul>${bills.map((b) => billRow(b)).join('')}</ul></div></section>
      <section style="display:grid;gap:8px"><button class="btn primary block" data-act="toast" data-msg="Editar contrato: arrendatario, correo, canon, día de pago y fechas. No hace parte de este mock">${ic('pencil', 15)}Editar contrato</button><button class="btn block" data-act="toast" data-msg="Editar ${u.name}: nombre y uso. No hace parte de este mock">${ic('pencil', 15)}Editar unidad</button><button class="btn danger block" data-act="toast" data-msg="Terminar contrato pide confirmación; no hace parte de este mock">Terminar contrato</button></section>
    </div>`;
}
function panePay(b) {
  const u = billUnit(b);
  return `<div class="pane-head"><a class="icon-btn" href="#bill/${b.id}" aria-label="Volver a la cuenta">${ic('back', 20)}</a>
      <div class="ttl"><b>Registrar pago</b><span>${u.name} · ${u.tenant} · ${billNo(b.number)}</span></div></div>
    <form class="pane-body form" id="pay-form" data-id="${b.id}">
      <div class="field"><label for="pay-amount">Valor recibido</label>
        <input class="input amount num" id="pay-amount" inputmode="numeric" autocomplete="off" value="${pesos(b.balance)}">
        <div class="quick"><button type="button" class="btn sm" data-act="amount" data-v="${b.balance}">Saldo completo</button><button type="button" class="btn sm" data-act="amount" data-v="${Math.round(b.balance / 2)}">La mitad</button></div>
        <p class="hint" id="pay-hint" aria-live="polite"></p></div>
      <div class="field"><label for="pay-date">Fecha del pago</label><input class="input" id="pay-date" type="date" value="${TODAY}" max="${TODAY}"></div>
      <fieldset class="field"><legend>Medio de pago</legend><div class="seg4">${Object.entries(METHODS).map(([k, l], i) => `<label><input type="radio" name="method" value="${k}" ${i === 0 ? 'checked' : ''}>${l}</label>`).join('')}</div></fieldset>
      <div class="field"><span class="small" style="font-weight:600">Comprobante <span class="muted" style="font-weight:400">(opcional)</span></span>
        <button type="button" class="drop" data-act="toast" data-msg="Aquí se adjunta un PDF, JPG o PNG">${ic('clip', 17)}Adjuntar foto o PDF</button></div>
      <label class="check"><input type="checkbox" checked><i>${ic('check', 15, 3)}</i>Enviar recibo a ${u.short}</label>
      <div class="foot2"><a class="btn" href="#bill/${b.id}">Cancelar</a><button class="btn primary">Guardar pago</button></div>
    </form>`;
}
function payHint() {
  const form = document.getElementById('pay-form');
  if (!form) return;
  const b = billById(form.dataset.id), input = document.getElementById('pay-amount');
  const value = Math.min(parsePesos(input.value), b.balance), left = b.balance - value;
  input.value = value ? pesos(value) : '';
  const hint = document.getElementById('pay-hint');
  hint.className = 'hint ' + (value && !left ? 'st-paid' : value ? 'st-partial' : '');
  hint.innerHTML = !value ? `Saldo de la cuenta: ${pesos(b.balance)}` : left ? `${ic('half', 14)}Abono. Queda un saldo de ${pesos(left)}` : `${ic('check', 14, 2.5)}La cuenta queda pagada`;
}

function render() {
  const inPane = PANE_ROUTES.includes(ROUTE.name);
  const bill = ROUTE.name === 'bill' || ROUTE.name === 'pay' ? billById(ROUTE.arg) : null;
  const unit = ROUTE.name === 'unit' ? unitById(ROUTE.arg) : null;
  if (!inPane) LIST = SCREENS[ROUTE.name] ? ROUTE.name : 'home';
  if (unit) LIST = 'properties';
  const scroll = window.scrollY;
  document.getElementById('view').innerHTML = SCREENS[LIST]() + `<p class="mock-note">Mock · Propuesta B «Libro» · <a href="index.html">ver las tres propuestas</a></p>`;
  document.getElementById('nav').innerHTML = navHTML(LIST);
  const pane = document.getElementById('pane');
  const shown = bill || unit;
  const samePane = !pane.hidden && shown;
  pane.hidden = !shown;
  document.getElementById('app').classList.toggle('has-pane', !!shown);
  if (shown) {
    const paying = bill && ROUTE.name === 'pay' && isOpen(bill);
    pane.innerHTML = unit ? paneUnit(unit) : paying ? panePay(bill) : paneBill(bill);
    if (samePane) pane.style.animation = 'none'; else pane.style.animation = '';
    pane.scrollTop = 0;
    if (paying) { payHint(); document.getElementById('pay-amount').focus({ preventScroll: true }); }
    window.scrollTo(0, scroll);
  } else if (PREV && PANE_ROUTES.includes(PREV.name)) window.scrollTo(0, scroll);
  else window.scrollTo(0, 0);
}
function onAct(act, el) {
  if (act === 'close') location.hash = LIST;
  if (act === 'filter') { FILTER.status = el.dataset.status; render(); }
  if (act === 'amount') { document.getElementById('pay-amount').value = el.dataset.v; payHint(); }
}
document.addEventListener('change', (e) => { if (e.target.matches('[data-auto]')) { LEASES[e.target.dataset.auto].auto = e.target.checked; toast(e.target.checked ? 'Envío automático activado' : 'Envío automático desactivado'); } });
document.addEventListener('change', (e) => { if (e.target.matches('[data-filter-unit]')) { FILTER.unit = e.target.value; render(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'pay-amount') payHint(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && PANE_ROUTES.includes(ROUTE.name)) location.hash = ROUTE.name === 'pay' ? 'bill/' + ROUTE.arg : LIST; });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const amount = parsePesos(document.getElementById('pay-amount').value);
  if (!amount) { toast('Escribe el valor recibido'); return; }
  const b = registerPayment(e.target.dataset.id, amount, e.target.method.value, document.getElementById('pay-date').value);
  toast(b.status === 'paid' ? `Pago guardado. ${billUnit(b).name} quedó al día` : `Abono guardado. Saldo: ${pesos(b.balance)}`);
  location.hash = 'bill/' + b.id;
});
/* Hover layer of the charts and the icon-only buttons */
const tip = document.getElementById('tip');
function showTip(e) {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.classList.remove('on'); return; }
  const r = t.getBoundingClientRect();
  tip.textContent = t.dataset.tip;
  tip.style.left = Math.min(Math.max(r.left + r.width / 2, 90), innerWidth - 90) + 'px';
  tip.style.top = r.top + 'px';
  tip.classList.add('on');
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);
document.addEventListener('focusout', () => tip.classList.remove('on'));

document.querySelectorAll('[data-mark]').forEach((el) => { el.outerHTML = mark(+el.dataset.mark); });
document.querySelector('[data-back]').outerHTML = ic('back', 20);
start();
</script>
</body>
</html>
