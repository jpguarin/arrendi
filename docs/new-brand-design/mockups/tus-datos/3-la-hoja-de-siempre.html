<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tus datos · 3 · La hoja de siempre</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Red+Hat+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../alta-guiada/base.css">
<link rel="stylesheet" href="datos.css">
<style>
/* The sheet the app has today (proposal 4 of alta-guiada), with "Tus datos" first. */
.wrap { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 24px 16px 32px; display: grid; gap: 24px; align-items: start; }
@media (min-width: 768px) { .wrap { grid-template-columns: minmax(0, 1fr) 280px; padding: 32px 24px; } }
@media (min-width: 1024px) { .wrap { grid-template-columns: minmax(0, 1fr) 340px; padding: 40px 32px; gap: 32px; } }
.intro { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.intro h1 { font-weight: 700; }
.intro p { color: var(--muted-foreground); font-size: 15px; }
.sections { display: flex; flex-direction: column; gap: 12px; }
.sec { overflow: hidden; }
.sec-head { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px; min-height: 72px; width: 100%; text-align: left; }
.sec-head:disabled { cursor: not-allowed; }
.sec-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-heading); font-weight: 800; font-size: 16px; background: var(--muted); color: var(--muted-foreground); }
.sec.open .sec-n { background: var(--primary); color: var(--primary-foreground); }
.sec.done .sec-n { background: var(--positive-tint); color: var(--positive-ink); }
.sec-n svg { width: 18px; height: 18px; }
.sec-title { font-size: 17px; font-weight: 700; font-family: var(--font-heading); letter-spacing: -.01em; }
.sec-sum { display: block; font-size: 14px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec.wait .sec-title { color: var(--muted-foreground); }
.sec.locked .sec-sum { display: flex; gap: 6px; align-items: center; }
.sec.locked .sec-sum svg { width: 14px; height: 14px; }
.sec.open { box-shadow: var(--shadow-lg); border-color: var(--input); }
.sec-body { padding: 4px 16px 20px 64px; display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 520px) { .sec-body { padding-left: 16px; } }
.sub-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); padding-top: 6px; border-top: 1px solid var(--border); }
.sub-h:first-child { border-top: 0; padding-top: 0; }
.sub-h svg { width: 16px; height: 16px; }
.sec-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ut { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.ut-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 44px; gap: 8px; align-items: center; padding: 6px 6px 6px 8px; border-top: 1px solid var(--border); }
.ut-row:first-child { border-top: 0; }
.ut-row .input, .ut-row .select { height: 44px; }
.toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-radius: 12px; background: var(--muted); }
.toggle-line b { display: block; font-size: 15px; }
.toggle-line small { font-size: 13px; color: var(--muted-foreground); }
.summary { display: none; }
@media (min-width: 768px) { .summary { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 24px; padding: 20px; } }
.summary h2 { font-family: var(--font-heading); font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.checklist li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
.checklist li:first-child { border-top: 0; }
.checklist .tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--input); color: transparent; }
.checklist .tick svg { width: 13px; height: 13px; }
.checklist li.is-ok .tick { background: var(--positive-tint); border-color: transparent; color: var(--positive-ink); }
.checklist b { display: block; font-weight: 600; }
.checklist span { color: var(--muted-foreground); }
.summary .fine { font-size: 13px; color: var(--muted-foreground); }
.m-summary { display: flex; flex-direction: row; align-items: center; gap: 12px; }
.m-summary p { flex: 1; font-size: 13px; color: var(--muted-foreground); line-height: 1.35; }
.m-summary p b { display: block; color: var(--foreground); font-size: 14px; }
@media (min-width: 768px) { .action-footer.m-summary { display: none; } }
.done-box { max-width: 560px; margin: 0 auto; padding: 48px 20px; display: flex; flex-direction: column; gap: 20px; }
.done-box h1 { font-size: 28px; font-weight: 800; line-height: 1.2; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../alta-guiada/base.js"></script>
<script src="datos.js"></script>
<script>
const ORDER = ['owner', 'property', 'units', 'lease', 'done'];
const DONE = { owner: false, property: false, units: false, lease: false };

const ownerSum = () => [draft.owner.name, draft.owner.document_number && `${docShort(draft.owner.document_type)} ${draft.owner.document_number}`, draft.owner.send_day && `envío el ${draft.owner.send_day}`].filter(Boolean).join(' · ');
const propertySum = () => [draft.property.name, typeLabel(draft.property.type), draft.property.city].filter(Boolean).join(' · ');
const unitsSum = () => draft.units.filter((u) => u.name).map((u) => u.name).join(', ');
const leaseSum = () => (draft.withLease ? [draft.lease.tenant_name, draft.units[draft.lease.unit]?.name, draft.lease.rent && pesos(draft.lease.rent)].filter(Boolean).join(' · ') : 'Lo agregas después');

function section(key, n, title, hint, summary, body) {
  const open = current === key;
  const done = DONE[key] && !open;
  // Nothing of the property opens before the owner's data is saved.
  const locked = key !== 'owner' && !DONE.owner;
  const prev = ORDER[ORDER.indexOf(key) - 1];
  const reachable = !locked && (done || ORDER.indexOf(key) <= ORDER.indexOf(current) || DONE[prev]);
  const state = open ? 'open' : done ? 'done' : locked ? 'wait locked' : 'wait';
  const sub = done ? esc(summary) : locked ? `${icon('lock', 14)}Se abre al guardar tus datos` : hint;
  return `<section class="card sec ${state}" aria-labelledby="sec-${key}">
    <button type="button" class="sec-head" ${open ? 'aria-expanded="true"' : `aria-expanded="false" data-open="${key}"`} ${reachable || open ? '' : 'disabled'}>
      <span class="sec-n">${done ? icon('check') : n}</span>
      <span style="min-width:0"><span class="sec-title" id="sec-${key}">${title}</span><span class="sec-sum">${sub}</span></span>
      ${done ? '<span class="btn-link" style="font-size:14px;min-height:0">Editar</span>' : ''}
    </button>
    ${open ? `<div class="sec-body fade">${body()}</div>` : ''}
  </section>`;
}

const ownerBody = () => `
  <p class="sub-h">${icon('id-card')}Quién cobra</p>
  ${field({ path: 'owner.name', label: 'Tu nombre o razón social', autocomplete: 'name' })}
  ${documentFields()}
  <p class="sub-h">${icon('landmark')}Cómo te pagan</p>
  ${paymentBuilder()}
  <p class="sub-h">${icon('signature')}Firma y envío</p>
  ${signaturePad()}
  ${sendDayChips()}
  <p class="why">${icon('info', 16)}Salen en cada cuenta de cobro. Se guardan al continuar, aunque no termines el inmueble hoy.</p>
  <div class="sec-actions"><button class="btn btn-primary btn-md" data-act="next">Guardar y continuar</button></div>`;
const propertyBody = () => `
  ${field({ path: 'property.name', label: 'Nombre del inmueble', placeholder: 'Casa La Soledad', help: 'Un nombre corto para reconocerlo.' })}
  ${toggleGroup({ path: 'property.type', label: 'Tipo', options: PROPERTY_TYPES, cols: 4 })}
  <div class="row-2">${field({ path: 'property.address', label: 'Dirección', optional: true })}${field({ path: 'property.city', label: 'Ciudad', optional: true })}</div>
  <div class="sec-actions"><button class="btn btn-primary btn-md" data-act="next">Continuar</button></div>`;
const unitsBody = () => `
  <div class="ut">${draft.units.map((u, i) => `<div class="ut-row">
    <span><label class="sr-only" for="units-${i}-name">Nombre de la unidad ${i + 1}</label><input class="input" id="units-${i}-name" data-bind="units.${i}.name" value="${esc(u.name)}" placeholder="Apto ${i + 1}" ${invalid(`units.${i}.name`)}></span>
    <span><label class="sr-only" for="units-${i}-use">Uso</label><select class="select" id="units-${i}-use" data-bind="units.${i}.use">${UNIT_USES.map((o) => `<option value="${o.value}" ${u.use === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}</select></span>
    <span><button type="button" class="icon-btn" data-remove="${i}" aria-label="Quitar la unidad ${i + 1}" ${draft.units.length === 1 ? 'disabled' : ''}>${icon('x')}</button></span></div>`).join('')}</div>
  <div class="sec-actions"><button type="button" class="btn btn-dashed btn-md" data-act="add">${icon('plus')}Agregar unidad</button><button class="btn btn-primary btn-md" data-act="next">Continuar</button></div>`;
const leaseBody = () => `
  <div class="toggle-line"><div><b>Agregar el primer contrato ahora</b><small>Si no, lo agregas desde la unidad.</small></div><button type="button" class="switch" role="switch" aria-checked="${draft.withLease}" aria-label="Agregar el primer contrato ahora" data-act="with-lease"></button></div>
  ${draft.withLease ? `<div class="row-2">${field({ path: 'lease.tenant_name', label: 'Arrendatario' })}${field({ path: 'lease.tenant_email', label: 'Correo', type: 'email' })}</div>
  <div class="row-2">${moneyField({ path: 'lease.rent', label: 'Canon mensual' })}${selectField({ path: 'lease.due_day', label: 'Día de pago', options: DUE_DAYS, placeholder: 'Elige' })}</div>
  ${field({ path: 'lease.start_date', label: 'Inicio', type: 'date' })}` : ''}`;

function checklist() {
  const items = [
    { ok: DONE.owner, title: 'Tus datos', sub: DONE.owner ? ownerSum() : 'Documento, pago, firma y envío' },
    { ok: DONE.property, title: draft.property.name || 'Tu inmueble', sub: typeLabel(draft.property.type) || 'Nombre y tipo' },
    { ok: DONE.units, title: 'Unidades', sub: unitsSum() || 'Sus nombres y uso' },
    { ok: DONE.lease, title: draft.withLease ? 'Primer contrato' : 'Sin contrato por ahora', sub: draft.withLease ? (leaseSum() || 'Arrendatario y canon') : 'Lo agregas desde la unidad' },
  ];
  return `<ul class="checklist">${items.map((i) => `<li class="${i.ok ? 'is-ok' : ''}"><span class="tick">${icon('check')}</span><p><b>${esc(i.title)}</b><span>${esc(i.sub)}</span></p></li>`).join('')}</ul>`;
}
const canCreate = () => DONE.owner && DONE.property && DONE.units;

function sheet() {
  return `<div class="page"><div class="top">${brand(24)}</div>
    <div class="wrap">
      <div>
        <div class="intro"><p class="greet">Hola, ${OWNER.first}</p><h1 class="text-title-onboarding">Configura tu primer inmueble</h1><p>Primero tus datos, que van en cada cuenta de cobro. Después el inmueble, en la misma hoja.</p></div>
        <form class="sections" novalidate>
          ${section('owner', 1, 'Tus datos', 'Documento, cómo te pagan, firma y día de envío', ownerSum(), ownerBody)}
          ${section('property', 2, 'Inmueble', 'Nombre, tipo y dirección', propertySum(), propertyBody)}
          ${section('units', 3, 'Unidades', 'Cada espacio que cobras por separado', unitsSum(), unitsBody)}
          ${section('lease', 4, 'Primer contrato', 'Opcional: arrendatario, canon y fechas', leaseSum(), leaseBody)}
        </form>
      </div>
      <aside class="card summary" aria-label="Lo que vas a crear">
        <h2>Lo que vas a crear</h2>
        <div id="checklist">${checklist()}</div>
        <button class="btn btn-primary btn-block" data-act="create" ${canCreate() ? '' : 'aria-disabled="true"'}>Crear inmueble</button>
        <p class="fine">Tus datos se guardan al continuar; el inmueble, al crearlo.</p>
      </aside>
    </div>
    <div class="action-footer m-summary"><p><b>${DONE.owner ? esc(draft.property.name) || 'Tu inmueble' : 'Tus datos'}</b>${DONE.owner ? `${draft.units.filter((u) => u.name).length} unidades · ${draft.withLease ? '1 contrato' : 'sin contrato'}` : 'Primero, cómo cobras'}</p><button class="btn btn-primary" data-act="create" ${canCreate() ? '' : 'aria-disabled="true"'}>Crear</button></div>
  </div>`;
}
function doneScreen() {
  return `<div class="page"><div class="top">${brand(24)}</div>
  <div class="done-box ${enterClass()}">
    <div class="ok">${icon('check')}</div>
    <p class="greet">Listo, ${OWNER.first}</p>
    <h1 class="font-heading">${esc(draft.property.name || 'Tu inmueble')} quedó creado</h1>
    <p class="muted">Con tus datos de cobro, tu firma y el envío el día ${esc(draft.owner.send_day)} de cada mes.</p>
    <button class="btn btn-primary" style="align-self:flex-start" data-act="home">Ir al resumen</button>
  </div></div>`;
}

function render() {
  document.getElementById('app').innerHTML = (current === 'done' ? doneScreen() : sheet()) + themeButton();
  mountSignature();
}
onDraftChange = (path) => { if (path.startsWith('owner.')) ownerChanged(path); const c = document.getElementById('checklist'); if (c) c.innerHTML = checklist(); };

document.addEventListener('click', (event) => {
  const t = event.target.closest('button, a');
  if (!t) return;
  if (t.dataset.open) { go(t.dataset.open); return; }
  if (t.dataset.remove) { draft.units.splice(+t.dataset.remove, 1); render(); return; }
  const act = t.dataset.act;
  if (!act) return;
  if (act === 'add') { draft.units.push({ name: suggestUnitName('residential', draft.units), use: 'residential' }); render(); }
  if (act === 'with-lease') { draft.withLease = !draft.withLease; render(); }
  if (act === 'next') {
    event.preventDefault();
    const ok = current === 'owner' ? ((errors = validateOwner()), Object.keys(errors).length === 0) : validate(current);
    if (ok) { DONE[current] = true; if (current === 'owner') toast('Guardamos tus datos.'); go(ORDER[ORDER.indexOf(current) + 1]); }
    else { render(); focusFirstError(); }
  }
  if (act === 'create') {
    event.preventDefault();
    if (!canCreate()) { toast(DONE.owner ? 'Completa el inmueble y sus unidades.' : 'Primero guarda tus datos.'); return; }
    go('done');
  }
  if (act === 'home') toast('Aquí la app abre el resumen.');
});
document.addEventListener('submit', (e) => e.preventDefault());

const start = location.hash.slice(1);
if (ORDER.indexOf(start) > 0) { DONE.owner = true; prefillOwner(4); }
if (ORDER.indexOf(start) > 1) { DONE.property = true; draft.property = { ...DEMO.property }; }
if (ORDER.indexOf(start) > 2) { DONE.units = true; draft.units = DEMO.units.map((u) => ({ ...u })); }
if (start === 'done') DONE.lease = true;
startRouter(ORDER, { owner: 2, property: 4, units: 4, lease: 4, done: 4 });
</script>
</body>
</html>
